  <div class="sb-main">
    <header class="sb-top">
      <label class="ifx-search"><i class="ti ti-search ifx-icon ifx-icon-sm"></i><input type="search" placeholder="Tìm…"></label>
      <button type="button" class="sb-theme-toggle" id="sbThemeToggle">Theme: Dark</button>
      <span class="ifx-avatar">DS</span>
    </header>
    <div class="sb-body">

      <header class="ifx-page-header">
        <nav aria-label="Breadcrumb"><ol class="ifx-breadcrumb">
          <li><a href="../?section=baseline">Catalog</a></li>
          <li class="ifx-breadcrumb-sep">/</li>
          <li class="ifx-breadcrumb-current">Chat</li>
        </ol></nav>
        <div class="ifx-page-header-bar">
          <div>
            <h1 class="ifx-page-header-title">Hội thoại</h1>
            <p class="ifx-page-header-desc">Compose Chat Family. Generic.</p>
          </div>
        </div>
      </header>
      <div class="ifx-chat" data-ifx-chat>
        <div class="ifx-chat-thread">
          <button type="button" class="ifx-chat-item is-active" data-ifx-chat-name="Nhóm A">
            <span class="ifx-avatar ifx-avatar-sm ifx-avatar-online">A</span>
            <span><span class="ifx-chat-item-name">Nhóm A</span><span class="ifx-chat-item-preview">Tin gần nhất</span></span>
          </button>
          <button type="button" class="ifx-chat-item" data-ifx-chat-name="Nhóm B">
            <span class="ifx-avatar ifx-avatar-sm ifx-avatar-success">B</span>
            <span><span class="ifx-chat-item-name">Nhóm B</span><span class="ifx-chat-item-preview">Preview</span></span>
          </button>
          <button type="button" class="ifx-chat-item" data-ifx-chat-name="Nhóm C">
            <span class="ifx-avatar ifx-avatar-sm ifx-avatar-info">C</span>
            <span><span class="ifx-chat-item-name">Nhóm C</span><span class="ifx-chat-item-preview">Preview</span></span>
          </button>
        </div>
        <div class="ifx-chat-main">
          <div class="ifx-chat-header" data-ifx-chat-title>Nhóm A</div>
          <div class="ifx-chat-body" data-ifx-chat-body>
            <div class="ifx-chat-message">
              <span class="ifx-avatar ifx-avatar-sm">A</span>
              <div><div class="ifx-chat-bubble">Xin chào — demo generic.</div><div class="ifx-chat-meta">09:01</div></div>
            </div>
            <div class="ifx-chat-message is-sent">
              <div><div class="ifx-chat-bubble">Đã nhận.</div><div class="ifx-chat-meta">09:02</div></div>
            </div>
          </div>
          <form class="ifx-chat-input-bar" data-ifx-chat-form>
            <input class="ifx-chat-input" placeholder="Nhắn…">
            <button type="submit" class="ifx-btn ifx-btn-primary">Gửi</button>
          </form>
        </div>
      </div>

    </div>
  </div>
