<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Wizard · Canonical DS</title>
  <link rel="stylesheet" href="assets/entry.css">
</head>
<body>
<div class="sb-app">

      <aside class="sb-aside">
        <div class="sb-brand">iFlux DS</div>
        <nav class="ifx-nav-group" aria-label="Baseline patterns">
          <span class="ifx-nav-group-label">Patterns</span>
          <a class="ifx-nav-item" href="table-list.html" data-sb-nav="table-list"><i class="ti ti-table ifx-nav-icon"></i><span class="ifx-nav-label">Bảng danh sách</span></a>
          <a class="ifx-nav-item" href="form-add.html" data-sb-nav="form-add"><i class="ti ti-forms ifx-nav-icon"></i><span class="ifx-nav-label">Form thêm/sửa</span></a>
          <a class="ifx-nav-item" href="order-list.html" data-sb-nav="order-list"><i class="ti ti-clipboard-list ifx-nav-icon"></i><span class="ifx-nav-label">Danh sách</span></a>
          <a class="ifx-nav-item" href="order-detail.html" data-sb-nav="order-detail"><i class="ti ti-file-description ifx-nav-icon"></i><span class="ifx-nav-label">Chi tiết</span></a>
          <a class="ifx-nav-item" href="user-profile.html" data-sb-nav="user-profile"><i class="ti ti-user ifx-nav-icon"></i><span class="ifx-nav-label">Hồ sơ</span></a>
          <a class="ifx-nav-item" href="wizard.html" data-sb-nav="wizard"><i class="ti ti-stairs-up ifx-nav-icon"></i><span class="ifx-nav-label">Wizard</span></a>
          <a class="ifx-nav-item" href="chat.html" data-sb-nav="chat"><i class="ti ti-messages ifx-nav-icon"></i><span class="ifx-nav-label">Chat</span></a>
          <a class="ifx-nav-item" href="referrals.html" data-sb-nav="referrals"><i class="ti ti-users-group ifx-nav-icon"></i><span class="ifx-nav-label">Giới thiệu</span></a>
          <a class="ifx-nav-item" href="charts.html" data-sb-nav="charts"><i class="ti ti-chart-pie ifx-nav-icon"></i><span class="ifx-nav-label">Biểu đồ</span></a>
        </nav>
        <hr class="ifx-nav-divider">
        <nav class="ifx-nav-group">
          <a class="ifx-nav-item" href="../?section=baseline"><i class="ti ti-arrow-left ifx-nav-icon"></i><span class="ifx-nav-label">Catalog</span></a>
        </nav>
      </aside>

  <div class="sb-main">
    <header class="sb-top">
      <label class="ifx-search"><i class="ti ti-search ifx-icon ifx-icon-sm"></i><input type="search" placeholder="Tìm…"></label>
      <button type="button" class="sb-theme-toggle" id="sbThemeToggle">Theme: Dark</button>
      <span class="ifx-avatar">DS</span>
    </header>
    <div class="sb-body">

      <header class="ifx-page-header">
        <nav aria-label="Breadcrumb"><ol class="ifx-breadcrumb">
          <li><a href="../?section=baseline">Catalog</a></li>
          <li class="ifx-breadcrumb-sep">/</li>
          <li class="ifx-breadcrumb-current">Wizard</li>
        </ol></nav>
        <div class="ifx-page-header-bar">
          <div>
            <h1 class="ifx-page-header-title">Thiết lập bản ghi</h1>
            <p class="ifx-page-header-desc">5 bước generic — không bất động sản.</p>
          </div>
        </div>
      </header>
      <div class="ifx-card">
        <div class="ifx-card-body">
          <div class="ifx-wizard" data-ifx-wizard>
            <div class="ifx-wizard-steps">
              <button type="button" class="ifx-wizard-step is-active"><span class="ifx-wizard-circle">1</span><span><span class="ifx-wizard-step-title">Vai trò</span><span class="ifx-wizard-step-sub">Bước 1</span></span></button>
              <button type="button" class="ifx-wizard-step"><span class="ifx-wizard-circle">2</span><span><span class="ifx-wizard-step-title">Thông tin</span><span class="ifx-wizard-step-sub">Bước 2</span></span></button>
              <button type="button" class="ifx-wizard-step"><span class="ifx-wizard-circle">3</span><span><span class="ifx-wizard-step-title">Thuộc tính</span><span class="ifx-wizard-step-sub">Bước 3</span></span></button>
              <button type="button" class="ifx-wizard-step"><span class="ifx-wizard-circle">4</span><span><span class="ifx-wizard-step-title">Phạm vi</span><span class="ifx-wizard-step-sub">Bước 4</span></span></button>
              <button type="button" class="ifx-wizard-step"><span class="ifx-wizard-circle">5</span><span><span class="ifx-wizard-step-title">Giá</span><span class="ifx-wizard-step-sub">Bước 5</span></span></button>
            </div>
            <div class="ifx-wizard-body">
              <div class="ifx-wizard-panel is-active">
                <div class="sb-pat-radios">
                  <button type="button" class="sb-pat-radio is-selected"><div class="sb-pat-radio-icon"><i class="ti ti-building"></i></div><div class="sb-pat-radio-title">Loại A</div><div class="sb-pat-radio-sub">Mô tả A</div></button>
                  <button type="button" class="sb-pat-radio"><div class="sb-pat-radio-icon"><i class="ti ti-home"></i></div><div class="sb-pat-radio-title">Loại B</div><div class="sb-pat-radio-sub">Mô tả B</div></button>
                  <button type="button" class="sb-pat-radio"><div class="sb-pat-radio-icon"><i class="ti ti-briefcase"></i></div><div class="sb-pat-radio-title">Loại C</div><div class="sb-pat-radio-sub">Mô tả C</div></button>
                </div>
              </div>
              <div class="ifx-wizard-panel">
                <div class="ifx-form-row">
                  <div class="ifx-form-group"><label class="ifx-label" for="wz-name">Tên</label><input class="ifx-input" id="wz-name"></div>
                  <div class="ifx-form-group"><label class="ifx-label" for="wz-mail">Email</label><input class="ifx-input" id="wz-mail"></div>
                </div>
              </div>
              <div class="ifx-wizard-panel">
                <label class="ifx-label"><input type="checkbox" class="ifx-checkbox"> Thuộc tính một</label>
                <label class="ifx-label"><input type="checkbox" class="ifx-checkbox"> Thuộc tính hai</label>
              </div>
              <div class="ifx-wizard-panel">
                <div class="ifx-form-group"><label class="ifx-label" for="wz-area">Phạm vi</label><input class="ifx-input" id="wz-area" placeholder="Số"></div>
              </div>
              <div class="ifx-wizard-panel">
                <div class="ifx-form-group"><label class="ifx-label" for="wz-price">Giá</label><input class="ifx-input" id="wz-price" placeholder="0"></div>
              </div>
              <div class="ifx-wizard-nav">
                <button type="button" class="ifx-btn ifx-btn-outline" data-ifx-wizard-prev>Trước</button>
                <button type="button" class="ifx-btn ifx-btn-primary" data-ifx-wizard-next>Tiếp</button>
                <button type="button" class="ifx-btn ifx-btn-success" data-ifx-wizard-submit>Lưu</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../../adapters/web/theme.js"></script>
<script src="../../components/pagination/pagination.js"></script>
<script src="../../components/drawer/drawer.js"></script>
<script src="../../components/modal/modal.js"></script>
<script src="../../components/toast/toast.js"></script>
<script src="../../components/dropdown/dropdown.js"></script>
<script src="../../components/tabs/tabs.js"></script>
<script src="../../components/wizard/wizard.js"></script>
<script src="../../components/chat/chat.js"></script>
<script src="../../components/chart/chart-adapter.js"></script>
<script src="js/boot.js"></script>

</body>
</html>
