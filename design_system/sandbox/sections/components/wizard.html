<section class="sb-section">
  <h2 class="sb-section-title">Wizard</h2>
  <div class="ifx-wizard" data-ifx-wizard>
    <div class="ifx-wizard-steps">
      <button type="button" class="ifx-wizard-step is-active"><span class="ifx-wizard-circle">1</span><span><span class="ifx-wizard-step-title">Thông tin</span><span class="ifx-wizard-step-sub">Bước 1</span></span></button>
      <button type="button" class="ifx-wizard-step"><span class="ifx-wizard-circle">2</span><span><span class="ifx-wizard-step-title">Chi tiết</span><span class="ifx-wizard-step-sub">Bước 2</span></span></button>
      <button type="button" class="ifx-wizard-step"><span class="ifx-wizard-circle">3</span><span><span class="ifx-wizard-step-title">Xác nhận</span><span class="ifx-wizard-step-sub">Bước 3</span></span></button>
    </div>
    <div class="ifx-wizard-body">
      <div class="ifx-wizard-panel is-active">
        <label class="ifx-label" for="w1">Tên</label>
        <input class="ifx-input" id="w1" placeholder="Bước 1">
      </div>
      <div class="ifx-wizard-panel">
        <label class="ifx-label" for="w2">Mô tả</label>
        <textarea class="ifx-textarea" id="w2"></textarea>
      </div>
      <div class="ifx-wizard-panel">Xem lại rồi lưu — demo generic.</div>
      <div class="ifx-wizard-nav">
        <button type="button" class="ifx-btn ifx-btn-outline" data-ifx-wizard-prev>Trước</button>
        <button type="button" class="ifx-btn ifx-btn-primary" data-ifx-wizard-next>Tiếp</button>
        <button type="button" class="ifx-btn ifx-btn-success" data-ifx-wizard-submit>Lưu</button>
      </div>
    </div>
  </div>
</section>
