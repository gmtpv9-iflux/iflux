<section class="sb-section">
  <h2 class="sb-section-title">Chart</h2>
  <p class="sb-section-desc">IfxChart đọc semantic token. Đổi Dark/Light — cột đổi màu. Height = token sandbox, không inline.</p>
  <div class="ifx-chart" data-ifx-chart>
    <div class="ifx-chart-col"><div class="ifx-chart-bar sb-ch-a" data-ifx-chart-bar></div><span class="ifx-chart-label">A</span></div>
    <div class="ifx-chart-col"><div class="ifx-chart-bar sb-ch-b" data-ifx-chart-bar></div><span class="ifx-chart-label">B</span></div>
    <div class="ifx-chart-col"><div class="ifx-chart-bar sb-ch-c" data-ifx-chart-bar></div><span class="ifx-chart-label">C</span></div>
    <div class="ifx-chart-col"><div class="ifx-chart-bar sb-ch-d" data-ifx-chart-bar></div><span class="ifx-chart-label">D</span></div>
    <div class="ifx-chart-col"><div class="ifx-chart-bar sb-ch-e" data-ifx-chart-bar></div><span class="ifx-chart-label">E</span></div>
  </div>
  <div class="ifx-chart-legend">
    <span><i class="ifx-chart-swatch" data-ifx-chart-swatch></i>primary</span>
    <span><i class="ifx-chart-swatch" data-ifx-chart-swatch></i>success</span>
    <span><i class="ifx-chart-swatch" data-ifx-chart-swatch></i>warning</span>
    <span><i class="ifx-chart-swatch" data-ifx-chart-swatch></i>danger</span>
    <span><i class="ifx-chart-swatch" data-ifx-chart-swatch></i>info</span>
  </div>
</section>
