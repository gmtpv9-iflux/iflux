<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="refresh" content="0; url=/cong-dong" />
  <title>iFlux</title>
  <script>
    try {
      if (localStorage.getItem('iflux_auth') || localStorage.getItem('iflux-token')) {
        location.replace('/nha-cua-toi');
      } else {
        location.replace('/cong-dong');
      }
    } catch (e) {
      location.replace('/cong-dong');
    }
  </script>
</head>
<body>
  <p><a href="/cong-dong">iFlux</a></p>
</body>
</html>
