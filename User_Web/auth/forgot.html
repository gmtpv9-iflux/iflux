<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quên mật khẩu · iFlux</title>
  <link rel="preload" href="/Admin_Design_system/iflux-admin-ui/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/fonts.css" />
  <link rel="stylesheet" href="../iflux-web-ui/iflux-web-ui.css" />
  </head>
<body class="ifx-auth-page">
<div class="ix-auth-root">
  <div class="ix-auth-card">
    <div class="ix-auth-brand">
      <span class="ix-auth-brand-name">iFlux</span>
    </div>

    <div class="ix-auth-title">Quên mật khẩu? 🔒</div>
    <div class="ix-auth-sub">OTP chỉ dùng khi quên mật khẩu — đăng nhập hàng ngày dùng mật khẩu</div>

    <div class="ix-tabs ifx-auth-tabs" id="forgot-tabs">
      <button type="button" class="ix-tab active" data-forgot-tab="email">Email</button>
      <button type="button" class="ix-tab" data-forgot-tab="phone">Số điện thoại</button>
    </div>

    <div id="forgot-email">
      <div class="ix-form-group">
        <label class="ix-label">Email</label>
        <input type="email" class="ix-input" id="forgot-email-input" placeholder="ban@iflux.vn" autofocus />
      </div>
      <button type="button" class="ix-btn ix-btn-primary" style="width:100%" id="btn-forgot-email">
        <i class="ti ti-send"></i> Gửi link đặt lại
      </button>
      <p class="ifx-auth-hint">Demo: hiển thị thông báo đã gửi link — production gửi email thật</p>
    </div>

    <div id="forgot-phone" style="display:none">
      <form id="forgot-phone-step1" class="ifx-otp-step active">
        <div class="ix-form-group">
          <label class="ix-label">Số điện thoại</label>
          <input type="tel" class="ix-input" id="forgot-phone-input" placeholder="0912 345 678" />
        </div>
        <button type="submit" class="ix-btn ix-btn-primary" style="width:100%" id="btn-forgot-phone-send">
          <i class="ti ti-send"></i> Gửi OTP đặt lại mật khẩu
        </button>
        <p class="ifx-auth-hint">Demo: mã OTP là <strong>123456</strong></p>
      </form>
      <form id="forgot-phone-step2" class="ifx-otp-step">
        <div class="ix-form-group">
          <label class="ix-label">Mã OTP (6 số)</label>
          <input type="text" class="ix-input" id="forgot-otp" placeholder="123456" maxlength="6" inputmode="numeric" />
        </div>
        <div class="ix-form-group">
          <label class="ix-label">Mật khẩu mới</label>
          <div class="ix-input-password-wrap">
            <input type="password" class="ix-input" id="forgot-new-password" placeholder="············" />
            <button type="button" class="ix-input-password-toggle" data-ix-toggle-password="forgot-new-password"><i class="ti ti-eye-off"></i></button>
          </div>
        </div>
        <button type="submit" class="ix-btn ix-btn-primary" style="width:100%;margin-bottom:8px">Đặt lại mật khẩu</button>
        <button type="button" class="ix-btn ix-btn-ghost" style="width:100%" id="btn-forgot-back">Đổi số điện thoại</button>
      </form>
    </div>

    <a href="login.html" class="ix-auth-back">
      <i class="ti ti-chevron-left" style="font-size:13px"></i> Quay lại đăng nhập
    </a>
  </div>
</div>
<script src="../../Admin_Design_system/iflux-admin-ui/iflux-credentials-store.js"></script>
<script src="../iflux-web-ui/iflux-platform-boot.js?v=20260707"></script>
<script src="../iflux-web-ui/iflux-api-bundle.js?v=authfix20260715"></script>
<script src="../iflux-web-ui/auth.js"></script>
<script src="../iflux-web-ui/iflux-user-data-sync.js"></script>
<script src="../../Admin_Design_system/iflux-admin-ui/iflux-admin-ui.js"></script>
<script src="../iflux-web-ui/iflux-web-ui.js"></script>
<script>
document.querySelectorAll('[data-forgot-tab]').forEach(function (tab) {
  tab.addEventListener('click', function () {
    document.querySelectorAll('#forgot-tabs .ix-tab').forEach(function (t) { t.classList.remove('active'); });
    tab.classList.add('active');
    var mode = tab.getAttribute('data-forgot-tab');
    document.getElementById('forgot-email').style.display = mode === 'email' ? '' : 'none';
    document.getElementById('forgot-phone').style.display = mode === 'phone' ? '' : 'none';
  });
});

document.getElementById('btn-forgot-email').addEventListener('click', function () {
  ixToast('Đã gửi link đặt lại mật khẩu (demo)', 'success');
});

document.getElementById('forgot-phone-step1').addEventListener('submit', function (e) {
  e.preventDefault();
  var phone = document.getElementById('forgot-phone-input').value.trim();
  if (!phone) { ixToast('Nhập số điện thoại', 'warning'); return; }
  document.getElementById('forgot-phone-step1').classList.remove('active');
  document.getElementById('forgot-phone-step2').classList.add('active');
  document.getElementById('forgot-otp').focus();
  ixToast('Đã gửi OTP (demo: 123456)', 'success');
});

document.getElementById('btn-forgot-back').addEventListener('click', function () {
  document.getElementById('forgot-phone-step2').classList.remove('active');
  document.getElementById('forgot-phone-step1').classList.add('active');
});

document.getElementById('forgot-phone-step2').addEventListener('submit', function (e) {
  e.preventDefault();
  var phone = document.getElementById('forgot-phone-input').value.trim();
  var otp = document.getElementById('forgot-otp').value.trim();
  var newPassword = document.getElementById('forgot-new-password').value;
  IfluxAuth.resetPasswordWithOtp(phone, otp, newPassword).then(function () {
    ixToast('Đã đặt lại mật khẩu — hãy đăng nhập bằng SĐT + mật khẩu mới', 'success');
    setTimeout(function () { location.href = 'login.html'; }, 600);
  }).catch(function (err) {
    ixToast(err.message, 'danger');
  });
});
</script>
</body>
</html>
