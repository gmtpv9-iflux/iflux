<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
  <link rel="preload" href="/Admin_Design_system/iflux-admin-ui/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <!-- CSS global User Web (App Shell + DS) — một file, sinh bởi ui_tooling/scripts/build-web-bundle.mjs -->
  <link rel="stylesheet" href="/platform/web/generated/web.css?v=11d83fe37c" />
  <script>
    document.documentElement.classList.add('ifx-user-web');
    document.addEventListener('DOMContentLoaded', function () {
      document.body.classList.add('ifx-user-web');
    });
  </script>
</head>
<body>
<div class="ifx-app">
  <header class="ifx-app-header">
    <a href="/tin-tuc" class="ifx-app-header-brand">
      <img class="ifx-app-header-logo" data-ifx-seo-logo alt="iFlux" width="120" height="32" hidden />
    </a>
    <nav class="ifx-app-header-menu" data-ifx-guest-nav></nav>
    <div class="ifx-app-header-actions" data-ifx-guest-actions>
      <div class="ifx-app-header-search" data-ifx-header-search>
        <div class="ifx-search ifx-app-header-search-box" role="combobox" aria-expanded="false">
          <i class="ti ti-search"></i>
          <input type="search" autocomplete="off" spellcheck="false" placeholder="Tìm CP, ngành, họ, chủ đề… (⌘K)" aria-label="Tìm kiếm thị trường" />
          <kbd class="ifx-app-header-search-kbd">⌘K</kbd>
        </div>
        <div class="ifx-app-header-search-results" hidden></div>
      </div>
      <div class="ifx-dropdown ifx-app-header-user">
        <button class="ifx-avatar ifx-avatar-md ifx-avatar-accent ifx-avatar-ring" data-ifx-toggle="dropdown" data-ifx-user-initials>U</button>
        <div class="ifx-dropdown-menu"></div>
      </div>
    </div>
  </header>
  <main class="ifx-container ifx-container-max ifx-main ifx-main--search">
    <div data-ifx-page-runtime></div>
  </main>
</div>
<script type="module" src="/User_Web/iflux-web-ui/runtime/bootstrap.js?v=99391c9d1a"></script>
</body>
</html>
