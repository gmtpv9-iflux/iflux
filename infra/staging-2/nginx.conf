# Staging 2 vhost — hostname production.iflux.vn (KHÔNG phải Production iflux.vn)
# Nguồn Git: infra/staging-2/nginx.conf · nhánh staging-2
# CI áp vào /etc/nginx/sites-available/production.iflux.vn.conf
# qua scripts/iflux-newprod-deploy-switch.sh
#
# CẤM trong file này: server_name iflux.vn · root /var/www/iflux/production
# · snippet iflux-prod-app · /admin/dang-nhap

server {
    server_name production.iflux.vn;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-IFlux-Env "newprod-clean" always;

    root /var/www/iflux/newprod;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin { try_files /admin/index.html =404; }
    location = /admin/ { try_files /admin/index.html =404; }
    location = /admin/login {
        return 301 /admin/login/$is_args$args;
    }
    location = /admin/login/ {
        try_files /admin/login/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/production.iflux.vn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/production.iflux.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = production.iflux.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name production.iflux.vn;
    return 404; # managed by Certbot
}
