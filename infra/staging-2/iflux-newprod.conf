# Production candidate — hostname production.iflux.vn
# Application = Staging 1 (User_Web + Admin_Design_system + backend).
# CẤM: server_name iflux.vn · root /var/www/iflux/production
# · snippet iflux-prod-app · proxy :3001 · path Staging 1 (/var/www/iflux/staging).
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/production.iflux.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/production.iflux.vn/privkey.pem;
    server_name production.iflux.vn;

    add_header X-IFlux-Env "production-next" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    include /etc/nginx/snippets/iflux-newprod-app.conf;
}
