# iFlux P1 — PRODUCTION
# Deploy: /etc/nginx/sites-enabled/iflux-production.conf
# Snippet: /etc/nginx/snippets/iflux-prod-app.conf

# SEO Platform (040826) — D-SEO-09 layered: decorated publicId → X-Robots-Tag
# Phải nằm http context (file sites-enabled được include trong http {}).
map $request_uri $iflux_x_robots_decorated {
    default "";
    "~*^/IFL[A-Za-z0-9]{5,17}(/|$)" "noindex, nofollow";
}

# HTTP → HTTPS (iflux.vn)
server {
    listen 80;
    listen [::]:80;
    server_name iflux.vn www.iflux.vn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/iflux/production;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — iflux.vn (production chính)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name iflux.vn www.iflux.vn;

    ssl_certificate /etc/letsencrypt/live/iflux.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iflux.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-IFlux-Env "production" always;
    # Owner LOCK 2026-08-09 — AI crawl/search/reference YES · AI train NO
    add_header Content-Signal "search=yes,ai-train=no,use=reference" always;

    # Admin media upload (favicon/logo/OG) — multer 15MB; nginx default 1m → 413/502 trên file >1MB
    client_max_body_size 16m;

    include /etc/nginx/snippets/iflux-prod-app.conf;
}

# HTTP — truy cập qua IP (không có SSL Let's Encrypt cho IP)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 103.154.177.157;

    add_header X-IFlux-Env "production" always;

    include /etc/nginx/snippets/iflux-prod-app.conf;
}
