# Index list Cộng đồng (không slug) — phải trước regex /:slug
location = /cong-dong/chu-de { rewrite ^ /User_Web/community/index.html break; root /var/www/iflux/production; }
location = /cong-dong/tac-gia { rewrite ^ /User_Web/community/index.html break; root /var/www/iflux/production; }
location = /cong-dong/danh-muc { rewrite ^ /User_Web/community/index.html break; root /var/www/iflux/production; }
location = /cong-dong/chu-de/ { return 301 /cong-dong/chu-de$is_args$args; }
location = /cong-dong/tac-gia/ { return 301 /cong-dong/tac-gia$is_args$args; }
location = /cong-dong/danh-muc/ { return 301 /cong-dong/danh-muc$is_args$args; }

location ~ ^/chu-de/([^/]+)$ { return 301 /cau-chuyen/$1$is_args$args; }
location ~ ^/cau-chuyen/([^/]+)/binh-luan/?$ { set $cmt_id $1; rewrite ^ /User_Web/comments/index.html?scope=story&id=$cmt_id last; }
location ~ ^/cau-chuyen/([^/]+)$ { rewrite ^ /User_Web/cau-chuyen/chi-tiet.html?id=$1 break; root /var/www/iflux/production; }
location ~ ^/cong-dong/chu-de/([^/]+)$ { rewrite ^ /User_Web/community/index.html break; root /var/www/iflux/production; }
location ~ ^/cong-dong/tac-gia/([^/]+)$ { rewrite ^ /User_Web/community/index.html break; root /var/www/iflux/production; }
location ~ ^/cong-dong/danh-muc/([^/]+)$ { rewrite ^ /User_Web/community/index.html break; root /var/www/iflux/production; }
location ~ ^/chu-de/([^/]+)/binh-luan/?$ { return 301 /cau-chuyen/$1/binh-luan$is_args$args; }
# Fallback Host (không entity) — CTA luôn dùng path nested; giữ alias query scope/id
location = /binh-luan { rewrite ^ /User_Web/comments/index.html break; root /var/www/iflux/production; }
location = /binh-luan/ { return 301 /binh-luan$is_args$args; }
location ~ ^/cong-dong/bai-viet/([^/]+)/binh-luan/?$ { set $cmt_id $1; rewrite ^ /User_Web/comments/index.html?scope=post&id=$cmt_id last; }
location ~ ^/co-phieu/([^/]+)/binh-luan/?$ { set $cmt_id $1; rewrite ^ /User_Web/comments/index.html?scope=stock&id=$cmt_id last; }
location ~ ^/nganh/([^/]+)/binh-luan/?$ { set $cmt_id $1; rewrite ^ /User_Web/comments/index.html?scope=sector&id=$cmt_id last; }
location ~ ^/he-sinh-thai/([^/]+)/binh-luan/?$ { set $cmt_id $1; rewrite ^ /User_Web/comments/index.html?scope=family&id=$cmt_id last; }
# Human / In-App → Pipeline B (SPA + Metadata SoT trong <head>).
# Bot share → Pipeline A (OG-only).
# CẤM khớp Zalo|WhatsApp|FBAN — In-App Browser = Human (không phải crawler).
location ~ ^/cong-dong/bai-viet/([^/]+)$ {
  set $post_slug $1;
  set $article_pipe spa;
  if ($http_user_agent ~* "(facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Slackbot|TelegramBot|Discordbot|Pinterest|SkypeUriPreview|Google-InspectionTool|BitsightBot)") {
    set $article_pipe open-graph;
  }
  if ($arg_og = "1") {
    set $article_pipe open-graph;
  }
  proxy_pass http://127.0.0.1:3001/api/community/articles/$post_slug/$article_pipe;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Original-URI $request_uri;
  add_header X-Robots-Tag $iflux_x_robots_decorated always;
}
location ~ ^/co-phieu/([^/]+)$ { rewrite ^ /User_Web/stock/index.html?ticker=$1 break; root /var/www/iflux/production; }
location ~ ^/nganh/([^/]+)$ { rewrite ^ /User_Web/sector/index.html?id=$1 break; root /var/www/iflux/production; }
location ~ ^/ho-co-phieu/([^/]+)$ { return 301 /he-sinh-thai/$1$is_args$args; }
location ~ ^/he-sinh-thai/([^/]+)$ { rewrite ^ /User_Web/family/index.html?id=$1 break; root /var/www/iflux/production; }

