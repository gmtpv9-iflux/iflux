# iFlux P1 — STAGING (port 8888 + staging.iflux.vn)
# Đồng bộ routing với Production qua snippet riêng (adapt path/port, không copy
# thủ công rời rạc) — xem /etc/nginx/snippets/iflux-staging-app.conf, sinh từ
# /etc/nginx/snippets/iflux-prod-app.conf (chỉ đổi root + proxy_pass port).
server {
    listen 8888;
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/staging.iflux.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.iflux.vn/privkey.pem;
    listen [::]:8888;
    server_name staging.iflux.vn _;

    add_header X-IFlux-Env "staging" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    include /etc/nginx/snippets/iflux-staging-app.conf;
}
