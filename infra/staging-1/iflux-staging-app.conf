# Fallback Host (không entity) — CTA luôn dùng path nested; giữ alias query scope/id
location = /binh-luan { rewrite ^ /User_Web/comments/index.html break; root /var/www/iflux/staging; }
location = /binh-luan/ { return 301 /binh-luan$is_args$args; }
location ~ ^/cong-dong/bai-viet/([^/]+)/binh-luan/?$ { set $cmt_id $1; rewrite ^ /User_Web/comments/index.html?scope=post&id=$cmt_id last; }
location ~ ^/co-phieu/([^/]+)/binh-luan/?$ { set $cmt_id $1; rewrite ^ /User_Web/comments/index.html?scope=stock&id=$cmt_id last; }
location ~ ^/nganh/([^/]+)/binh-luan/?$ { set $cmt_id $1; rewrite ^ /User_Web/comments/index.html?scope=sector&id=$cmt_id last; }
location ~ ^/he-sinh-thai/([^/]+)/binh-luan/?$ { set $cmt_id $1; rewrite ^ /User_Web/comments/index.html?scope=family&id=$cmt_id last; }
# Human / In-App → Pipeline B (SPA + Metadata SoT trong <head>).
# Bot share → Pipeline A (OG-only).
# Owner Final Decision A (2026-08-10): Zalo = crawler/social-preview → open-graph / hub shell.
# Vẫn không khớp WhatsApp|FBAN (In-App Browser = Human).
location ~ ^/cong-dong/bai-viet/([^/]+)$ {
  set $post_slug $1;
  set $article_pipe spa;
  if ($http_user_agent ~* "^(?!.*ZaloTheme).*(facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Slackbot|TelegramBot|Discordbot|Pinterest|SkypeUriPreview|Google-InspectionTool|BitsightBot|ZaloShare|Zalo)") {
    set $article_pipe open-graph;
  }
  if ($arg_og = "1") {
    set $article_pipe open-graph;
  }
  proxy_pass http://127.0.0.1:3002/api/community/articles/$post_slug/$article_pipe;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Original-URI $request_uri;
  add_header X-Robots-Tag $iflux_x_robots_decorated always;
}
location ~ ^/co-phieu/([^/]+)$ {
  error_page 418 = @seo_shell_stock_detail;
  if ($http_user_agent ~* "^(?!.*ZaloTheme).*(googlebot|bingbot|Google-InspectionTool|facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Slackbot|TelegramBot|ZaloShare|Zalo)") { return 418; }
  rewrite ^ /User_Web/stock/index.html?ticker=$1 break; root /var/www/iflux/staging;
  add_header X-Robots-Tag $iflux_x_robots_decorated always;
}
location ~ ^/nganh/([^/]+)$ {
  error_page 418 = @seo_shell_sector_detail;
  if ($http_user_agent ~* "^(?!.*ZaloTheme).*(googlebot|bingbot|Google-InspectionTool|facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Slackbot|TelegramBot|ZaloShare|Zalo)") { return 418; }
  rewrite ^ /User_Web/sector/index.html?id=$1 break; root /var/www/iflux/staging;
  add_header X-Robots-Tag $iflux_x_robots_decorated always;
}
location ~ ^/ho-co-phieu/([^/]+)$ { return 301 /he-sinh-thai/$1$is_args$args; }
location ~ ^/he-sinh-thai/([^/]+)$ {
  error_page 418 = @seo_shell_eco_detail;
