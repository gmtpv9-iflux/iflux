# iFlux production — URL công khai tiếng Việt + file vật lý User_Web / Admin
# Path English chỉ 301 → slug Việt (alias tạm).
root /var/www/iflux/staging;
index index.html;

# Single-owner title Human First HTML (SSI include /api/seo/platform/title-only) - tai dung resolveContract,
# cung nguon Bot Contract. Khong anh huong file khong co SSI marker.
ssi on;

# NOTE: map $iflux_x_robots_decorated sống ở http context — xem nginx-iflux-production.conf

location /api/ {
    proxy_pass http://127.0.0.1:3002/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# SEO discovery / identity (Plan P5 · P8) — backend SEO Platform, không static 404
location = /sitemap.xml {
    proxy_pass http://127.0.0.1:3002/sitemap.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ~ ^/sitemap-[0-9]+\.xml$ {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
}
location = /favicon.ico {
    proxy_pass http://127.0.0.1:3002/favicon.ico;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

# Community Media Library — public delivery URLs (/media/…)
# ^~ so regex static (*.png) elsewhere không “cướp” /media/*.original.png
location ^~ /media/ {
    proxy_pass http://127.0.0.1:3002/media/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 7d;
    add_header Cache-Control "public";
}

# ── Static assets ──
location ^~ /iflux-web-ui/ {
    alias /var/www/iflux/staging/User_Web/iflux-web-ui/;
}
location ^~ /iflux-admin-ui/ {
    alias /var/www/iflux/staging/Admin_Design_system/iflux-admin-ui/;
}

# P2 Affiliate Path Decorator — internal rewrite ONLY (MUST NOT 301/302).
# Pattern gate: publicId = IFL + 5–17 alnum. /ABC123/... does NOT match → not affiliate.
# Quote regex: nginx coi `{5,17}` là block nếu không có dấu ngoặc kép.
location ~* "^/IFL[A-Za-z0-9]{5,17}/(.+)$" {
    rewrite "(?i)^/IFL[A-Za-z0-9]{5,17}/(.+)$" /$1 last;
}
location ~* "^/IFL[A-Za-z0-9]{5,17}$" {
    rewrite ^ / last;
}
location ~* "^/IFL[A-Za-z0-9]{5,17}/iflux-web-ui/(.*)$" {
    rewrite "(?i)^/IFL[A-Za-z0-9]{5,17}/iflux-web-ui/(.*)$" /iflux-web-ui/$1 last;
}
location ~* "^/IFL[A-Za-z0-9]{5,17}/User_Web/(.*)$" {
    rewrite "(?i)^/IFL[A-Za-z0-9]{5,17}/User_Web/(.*)$" /User_Web/$1 last;
}

# Fallback: asset resolve sai từ clean URL
location ~ ^/(dang-nhap|dang-ky|quen-mat-khau|xac-minh-otp|auth|cong-dong|community|tai-khoan|account|tin-nhan|messages|goi-cuoc|pricing|hoi-dap|faq|thanh-vien|loyalty|membership|dong-tien|flow|trang-chu|nha-cua-toi|home|thi-truong|market|tim-kiem|search|theo-doi|watchlist|canh-bao|alerts|chia-se|share|co-phieu|stocks|nganh|sectors|he-sinh-thai|ho-co-phieu|ecosystems|stories|chu-de|cau-chuyen)/iflux-web-ui/(.*)$ {
    rewrite ^ /iflux-web-ui/$2 last;
}
location ~ ^/(dang-nhap|dang-ky|auth|cong-dong|community|tai-khoan|account|tin-nhan|messages)/Admin_Design_system/(.*)$ {
    rewrite ^ /Admin_Design_system/$2 last;
}

# Trailing slash → bỏ slash
location ~ ^/(trang-chu|nha-cua-toi|thi-truong|dong-tien|cong-dong|goi-cuoc|hoi-dap|thanh-vien|theo-doi|tim-kiem|canh-bao|chia-se|tai-khoan|tin-nhan|co-phieu|nganh|he-sinh-thai|ho-co-phieu|chu-de|cau-chuyen)/$ {
    return 301 /$1$is_args$args;
}
location ~ ^/(co-phieu|nganh|he-sinh-thai|ho-co-phieu|chu-de|cau-chuyen)/([^/]+)/$ {
    return 301 /$1/$2$is_args$args;
}

# Admin .html → clean
location ~ ^/admin/([^/]+)/([^/]+)\.html$ {
    return 301 /admin/$1/$2$is_args$args;
}
location ~ ^/admin/(?<admCss>[^/]+)\.css$ {
    rewrite ^ /Admin_Design_system/app/dashboard/$admCss.css break;
    root /var/www/iflux/staging;
}

sub_filter_once on;
sub_filter_types text/html;
# B2 PNC Foundation + Lifecycle — normalize-path · domain object · lifecycle gate
sub_filter '<head>' '<head><script src="/User_Web/iflux-web-ui/runtime/affiliate-resolver.js?v=regAffLock20260728"></script><script src="/User_Web/iflux-web-ui/runtime/iflux-normalize-path.js?v=b4w3_20260727"></script><script src="/User_Web/iflux-web-ui/runtime/navigation-context.js?v=b4w3_20260727"></script><script src="/User_Web/iflux-web-ui/runtime/pnc-shell-bridge.js?v=b4w3_20260727"></script><script src="/User_Web/iflux-web-ui/runtime/pnc-lifecycle.js?v=b4w3_20260727"></script><script src="/User_Web/iflux-web-ui/runtime/shell-url-writer.js?v=softNavEntity_20260811"></script><script src="/User_Web/iflux-web-ui/runtime/iflux-href.js?v=b4w3_20260727"></script><script src="/User_Web/iflux-web-ui/path-base.js?v=mktNavSot20260808"></script>';

# ── Root (`/` = landing home; URL sau redirect = canonical `/trang-chu`) ──
location = / { return 301 /trang-chu$is_args$args; }

# ── Quarantine zombie root shell (2026-07-24) ──
location = /index.html { return 301 /trang-chu$is_args$args; }
location = /bootstrap.js { return 404; }
location = /index.js { return 404; }
location = /community.manifest.js { return 404; }
location ^~ /home/ { return 301 /trang-chu$is_args$args; }
location = /guest { return 301 /$is_args$args; }

