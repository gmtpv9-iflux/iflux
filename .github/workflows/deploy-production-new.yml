name: Deploy to Production

# GitHub `production` → Canonical Production Runtime
#   iflux.vn → newprod → :3003
# Application artifact = User_Web + Admin_Design_system + backend.
# Khung deploy = atomic release + scoped switch (giữ path *-newprod — historical path).
# CẤM: leftover backup (/var/www/iflux/production, /var/iflux/backend, PM2 iflux-api)
# CẤM: Staging 1 (/var/www/iflux/staging, /var/iflux/backend-staging).
# Folder infra/staging-2/ = deploy plumbing, không phải tên branch.
# Runner self-hosted label "staging", user iflux-deploy.
# Sudo chỉ /usr/local/bin/iflux-newprod-deploy-switch.sh

on:
  push:
    branches:
      - production

concurrency:
  group: iflux-production-new-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, staging]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xác định release id
        id: rel
        run: echo "id=$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build frontend release (S1 artifact)
        run: |
          set -euo pipefail
          RELEASE_DIR="/var/www/iflux/releases-newprod/${{ steps.rel.outputs.id }}"
          mkdir -p "$RELEASE_DIR"
          cp -a "$GITHUB_WORKSPACE/User_Web" "$RELEASE_DIR/User_Web"
          cp -a "$GITHUB_WORKSPACE/Admin_Design_system" "$RELEASE_DIR/Admin_Design_system"

      - name: Build backend release (S1 artifact)
        run: |
          set -euo pipefail
          RELEASE_DIR="/var/iflux/backend-newprod/releases/${{ steps.rel.outputs.id }}"
          mkdir -p "$RELEASE_DIR"
          cp -a "$GITHUB_WORKSPACE/backend/." "$RELEASE_DIR/"
          cd "$RELEASE_DIR"
          npm install --omit=dev --no-audit --no-fund

      - name: Stage nginx + switch (ngoài web root)
        run: |
          set -euo pipefail
          META="/var/www/iflux/releases-newprod/${{ steps.rel.outputs.id }}.deploy"
          mkdir -p "$META"
          cp "$GITHUB_WORKSPACE/infra/staging-2/iflux-newprod.conf" "$META/iflux-newprod.conf"
          cp "$GITHUB_WORKSPACE/infra/staging-2/iflux-newprod-app.conf" "$META/iflux-newprod-app.conf"
          cp "$GITHUB_WORKSPACE/infra/staging-2/iflux-newprod-deploy-switch.sh" "$META/iflux-newprod-deploy-switch.sh"

      - name: Atomic switch + nginx + refresh switch
        run: sudo -n /usr/local/bin/iflux-newprod-deploy-switch.sh "${{ steps.rel.outputs.id }}"

      - name: Health check (iflux.vn)
        run: |
          set -euo pipefail
          sleep 3
          curl -fsS http://127.0.0.1:3003/health
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://iflux.vn/admin/login)
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "FAIL HTTPS iflux.vn/admin/login → $code" >&2
            exit 1
          fi

      - name: Dọn release cũ (giữ 5 bản, kèm .deploy)
        run: |
          set -euo pipefail
          cd /var/www/iflux/releases-newprod
          ls -1dt [0-9]* 2>/dev/null | grep -v '\.deploy$' | tail -n +6 | xargs -r rm -rf
          for d in *.deploy; do
            [ -e "$d" ] || continue
            base="${d%.deploy}"
            [ -d "$base" ] || rm -rf "$d"
          done
          cd /var/iflux/backend-newprod/releases && ls -1t | tail -n +6 | xargs -r rm -rf
