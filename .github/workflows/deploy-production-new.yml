name: Deploy to Staging 2

# Staging 2 — hostname hiện tại là production.iflux.vn, KHÔNG phải Production.
# Quyết định Owner 14/08/2026 sau "13 - Production <-> Staging Baseline
# Verification Report.md"; branch đổi tên production-clean -> staging-2 ngày
# 16/08/2026 để tên branch nói đúng môi trường nó phục vụ.
# CHỈ deploy sang production.iflux.vn (paths -newprod). KHÔNG bao giờ đụng
# Production thật
# (/var/www/iflux/production, /var/iflux/backend) hay Staging
# (/var/www/iflux/staging, /var/iflux/backend-staging).
# Runner tự host, cùng máy với Staging (label "staging"), user iflux-deploy
# (không root, không sudo rộng — chỉ scoped sudo cho đúng 1 script switch).

on:
  push:
    branches:
      - staging-2

concurrency:
  group: iflux-production-new-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, staging]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xác định release id
        id: rel
        run: echo "id=$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # Mã nguồn chia theo ranh giới kiến trúc (apps/ + packages/), trình duyệt
      # cần cây phẳng. dist/ không nằm trong Git — dựng lại mỗi lần deploy.
      - name: Lắp web root từ apps/ + packages/
        run: bash "$GITHUB_WORKSPACE/scripts/build-web.sh"

      - name: Build frontend release (atomic — thư mục riêng theo release id)
        run: |
          set -euo pipefail
          RELEASE_DIR="/var/www/iflux/releases-newprod/${{ steps.rel.outputs.id }}"
          mkdir -p "$RELEASE_DIR"
          cp -a "$GITHUB_WORKSPACE/dist/." "$RELEASE_DIR/"

      - name: Build backend release (services/api)
        run: |
          set -euo pipefail
          if [ -d "$GITHUB_WORKSPACE/services/api" ]; then
            RELEASE_DIR="/var/iflux/backend-newprod/releases/${{ steps.rel.outputs.id }}"
            mkdir -p "$RELEASE_DIR"
            cp -a "$GITHUB_WORKSPACE/services/api/." "$RELEASE_DIR/"
            cd "$RELEASE_DIR"
            npm install --omit=dev --no-audit --no-fund
          else
            echo "Chua co services/api/ trong branch nay — bo qua."
          fi

      - name: Atomic switch (frontend "/var/www/iflux/newprod" → release mới, backend nếu có)
        run: sudo -n /usr/local/bin/iflux-newprod-deploy-switch.sh "${{ steps.rel.outputs.id }}"

      - name: Health check (placeholder tĩnh, KHÔNG qua Production/Staging)
        run: |
          set -euo pipefail
          sleep 2
          curl -fsS https://production.iflux.vn/ > /dev/null

      - name: Dọn release cũ (giữ 5 bản gần nhất)
        run: |
          set -euo pipefail
          cd /var/www/iflux/releases-newprod && ls -1t | tail -n +6 | xargs -r rm -rf
          if [ -d /var/iflux/backend-newprod/releases ]; then
            cd /var/iflux/backend-newprod/releases && ls -1t | tail -n +6 | xargs -r rm -rf
          fi
