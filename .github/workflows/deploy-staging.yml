name: Deploy to Staging

# Staging — staging.iflux.vn. Cùng mô hình CI với Production (deploy-production.yml):
# checkout → atomic release → stage nginx + switch từ Git → switch → health.
# CHỈ path Staging. KHÔNG đụng Production
# (/var/www/iflux/production, /var/iflux/backend-production, PM2 iflux-api-production).
# Runner self-hosted label "staging", user iflux-deploy.
# Sudo chỉ /usr/local/bin/iflux-staging-deploy-switch.sh (script tự refresh từ Git).

on:
  push:
    branches:
      - staging

concurrency:
  group: iflux-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, staging]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # File sinh tự động (gói CSS global User Web) phải có trong Git và khớp nguồn —
      # thiếu / lệch thì dừng, không deploy trang mất CSS.
      - name: Kiểm tra gói CSS global
        run: node ui_tooling/scripts/build-web-bundle.mjs --check

      # Version query (?v=<hash>) của mọi JS/CSS riêng User Web phải khớp nội dung hiện tại —
      # xem docs/SoT — Runtime Loading & Caching Governance.md §5. Quên chạy sync-js-versions.mjs
      # sau khi sửa 1 file = cache cứng đầu, không phải lỗi logic — chặn deploy ngay tại đây.
      - name: Kiểm tra version JS/CSS User Web
        run: node ui_tooling/scripts/sync-js-versions.mjs --check

      - name: Xác định release id
        id: rel
        run: echo "id=$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build frontend release (atomic)
        run: |
          set -euo pipefail
          RELEASE_DIR="/var/www/iflux/releases-staging/${{ steps.rel.outputs.id }}"
          mkdir -p "$RELEASE_DIR"
          cp -a "$GITHUB_WORKSPACE/User_Web" "$RELEASE_DIR/User_Web"
          cp -a "$GITHUB_WORKSPACE/Admin_Design_system" "$RELEASE_DIR/Admin_Design_system"
          # Canonical Design System (Sub-01) — serve tại /design_system/ (nginx try_files chung)
          cp -a "$GITHUB_WORKSPACE/design_system" "$RELEASE_DIR/design_system"
          # Peer Pattern library — serve tại /patterns/
          if [ -d "$GITHUB_WORKSPACE/patterns" ]; then
            cp -a "$GITHUB_WORKSPACE/patterns" "$RELEASE_DIR/patterns"
          fi
          # Theme boot + Workbench/scripts + Tabler (ngoài DS)
          if [ -d "$GITHUB_WORKSPACE/adapters" ]; then
            cp -a "$GITHUB_WORKSPACE/adapters" "$RELEASE_DIR/adapters"
          fi
          if [ -d "$GITHUB_WORKSPACE/ui_tooling" ]; then
            cp -a "$GITHUB_WORKSPACE/ui_tooling" "$RELEASE_DIR/ui_tooling"
          fi
          if [ -d "$GITHUB_WORKSPACE/vendor" ]; then
            cp -a "$GITHUB_WORKSPACE/vendor" "$RELEASE_DIR/vendor"
          fi
          # CSS/JS riêng của nền tảng (platform/admin, platform/web) và module — ngoài Design System
          for d in platform modules; do
            if [ -d "$GITHUB_WORKSPACE/$d" ]; then
              cp -a "$GITHUB_WORKSPACE/$d" "$RELEASE_DIR/$d"
            fi
          done

      - name: Build backend release (atomic)
        run: |
          set -euo pipefail
          RELEASE_DIR="/var/iflux/backend-staging/releases/${{ steps.rel.outputs.id }}"
          mkdir -p "$RELEASE_DIR"
          cp -a "$GITHUB_WORKSPACE/backend/." "$RELEASE_DIR/"
          cd "$RELEASE_DIR"
          npm install --omit=dev --no-audit --no-fund

      - name: Stage Staging 1 nginx + switch (từ Git, ngoài web root)
        run: |
          set -euo pipefail
          META="/var/www/iflux/releases-staging/${{ steps.rel.outputs.id }}.deploy"
          mkdir -p "$META"
          cp "$GITHUB_WORKSPACE/infra/staging-1/iflux-staging.conf" "$META/iflux-staging.conf"
          cp "$GITHUB_WORKSPACE/infra/staging-1/iflux-staging-app.conf" "$META/iflux-staging-app.conf"
          cp "$GITHUB_WORKSPACE/infra/staging-1/iflux-staging-deploy-switch.sh" "$META/iflux-staging-deploy-switch.sh"

      - name: Atomic switch + nginx + refresh switch
        run: sudo -n /usr/local/bin/iflux-staging-deploy-switch.sh "${{ steps.rel.outputs.id }}"

      - name: Apply pending Staging DB migrations (062+)
        run: sudo -n /usr/local/bin/iflux-staging-deploy-switch.sh "${{ steps.rel.outputs.id }}" --migrate-only

      - name: Health check (Staging 1 only)
        run: |
          set -euo pipefail
          sleep 3
          curl -fsS http://127.0.0.1:3002/health
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://staging.iflux.vn/admin/login)
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "FAIL HTTPS staging.iflux.vn/admin/login → $code" >&2
            exit 1
          fi

      - name: Dọn release cũ (giữ 5 bản, kèm .deploy)
        run: |
          set -euo pipefail
          cd /var/www/iflux/releases-staging
          ls -1dt [0-9]* 2>/dev/null | grep -v '\.deploy$' | tail -n +6 | xargs -r rm -rf
          for d in *.deploy; do
            [ -e "$d" ] || continue
            base="${d%.deploy}"
            [ -d "$base" ] || rm -rf "$d"
          done
          cd /var/iflux/backend-staging/releases && ls -1t | tail -n +6 | xargs -r rm -rf
