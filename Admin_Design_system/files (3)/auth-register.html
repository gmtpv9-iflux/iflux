<!DOCTYPE html>
<html lang="vi">
<head>
  <script>try{var t=localStorage.getItem('iflux-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register — Vuexy Dark</title>
  <link rel="preload" href="/Admin_Design_system/iflux-admin-ui/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/fonts.css" />
  <link rel="stylesheet" href="../iflux-admin-ui/vendor/tabler-icons/tabler-icons.min.css" />
<link rel="stylesheet" href="vuexy-system.css" />
</head>
<body>
<div class="ix-auth-root">
  <div class="ix-auth-card">
    <div class="ix-auth-brand">
      <div class="ix-brand-logo" style="width:28px;height:28px">
        <svg viewBox="0 0 32 22" fill="white" width="22" height="15"><path fill-rule="evenodd" d="M0 0v6.85c0 0-.13 2.16 1.98 3.99L13.69 22l6.09-.08L18.8 9.88l-2.31-2.71L9.24 0H0z"/><path fill-rule="evenodd" d="M7.7 16.44L23.66 0H32v6.88c0 0-.17 2.29-1.34 3.52L19.78 22h-6.09L7.7 16.44z"/></svg>
      </div>
      <span class="ix-auth-brand-name">Vuexy</span>
    </div>

    <div class="ix-auth-title">Adventure starts here 🚀</div>
    <div class="ix-auth-sub">Make your app management easy and fun!</div>

    <div class="ix-form-group">
      <label class="ix-label">Username</label>
      <input type="text" class="ix-input" placeholder="Enter your username" autofocus />
    </div>
    <div class="ix-form-group">
      <label class="ix-label">Email</label>
      <input type="email" class="ix-input" placeholder="Enter your email" />
    </div>
    <div class="ix-form-group">
      <label class="ix-label">Password</label>
      <div style="position:relative">
        <input type="password" class="ix-input" placeholder="············" id="pw-reg" style="padding-right:40px" />
        <button onclick="var p=document.getElementById('pw-reg');p.type=p.type==='password'?'text':'password'" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ix-text-muted);font-size:16px"><i class="ti ti-eye-off"></i></button>
      </div>
    </div>
    <div style="margin:16px 0">
      <label class="ix-auth-check">
        <input type="checkbox" class="ix-checkbox" />
        <span>I agree to <a href="#" style="color:var(--ix-accent)">privacy policy &amp; terms</a></span>
      </label>
    </div>
    <button class="ix-btn ix-btn-primary" style="width:100%;margin-bottom:16px" onclick="ixToast('Account created!','success')">Sign up</button>

    <div class="ix-auth-footer">
      <span>Already have an account?</span> <a href="auth-login.html">Sign in instead</a>
    </div>

    <div class="ix-auth-divider">or</div>

    <div class="ix-auth-socials">
      <a class="ix-social-btn facebook" href="#"><i class="ti ti-brand-facebook-filled"></i></a>
      <a class="ix-social-btn twitter" href="#"><i class="ti ti-brand-twitter-filled"></i></a>
      <a class="ix-social-btn github" href="#"><i class="ti ti-brand-github-filled"></i></a>
      <a class="ix-social-btn google" href="#"><i class="ti ti-brand-google-filled"></i></a>
    </div>
  </div>
</div>
<script src="vuexy-system.js"></script>
  <script src="/Admin_Design_system/iflux-admin-ui/iflux-theme.js"></script>
</body>
</html>
