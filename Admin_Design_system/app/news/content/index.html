<!DOCTYPE html>
<html lang="vi">
<head>
  <script>try{var t=localStorage.getItem('iflux-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADM-COM-CNT — Danh sách bài viết · iFlux Admin</title>
  <link rel="preload" href="/Admin_Design_system/iflux-admin-ui/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/fonts.css" />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.css" />
</head>
<body>
<div class="ix-root">
  <div class="ix-layout">
    <aside class="ix-sidebar" data-ix-admin-shell="sidebar">
      <div class="ix-brand">
        <img class="ix-brand-logo" alt="iFlux" hidden />
        <span class="ix-brand-name">iFlux Admin</span>
      </div>
      <nav class="ix-menu" data-ix-admin-nav></nav>
    </aside>
    <main class="ix-main">
      <header class="ix-navbar" data-ix-admin-shell="header">
        <button class="ix-nav-btn" data-ix-toggle="sidebar" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
        <div class="ix-search"><i class="ti ti-search"></i><input type="text" id="art-q" placeholder="Tìm bài viết..." /></div>
        <div class="ix-nav-actions"><span class="ix-chip ix-chip-warning">Môi trường local</span><div class="ix-avatar"></div></div>
      </header>
      <div class="ix-content">
        <h1 class="ix-page-title">Danh sách bài viết</h1>
        <div class="ix-breadcrumb ix-mb-24" id="adm-page-bc"></div>
        <p style="font-size:13px;color:var(--ix-text-muted);margin:-8px 0 20px">Quản lý bài viết Cộng đồng — nguồn, danh mục, chủ đề, chủ thể và trạng thái xuất bản.</p>

        <div class="ix-card">
          <div class="ix-table-toolbar">
            <div style="font-size:13px;color:var(--ix-text-muted)">Tổng: <strong id="art-count">0</strong> bài viết</div>
            <div style="display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap">
              <select class="ix-select" id="art-status" style="width:auto;min-width:160px">
                <option value="">Tất cả trạng thái</option>
                <option value="draft">Nháp</option>
                <option value="pending">Chờ duyệt</option>
                <option value="published">Xuất bản</option>
                <option value="published_rss">Xuất bản (RSS)</option>
                <option value="scheduled">Đã lên lịch</option>
              </select>
              <button type="button" class="ix-btn ix-btn-outline ix-btn-sm" id="art-reload"><i class="ti ti-refresh"></i> Làm mới</button>
              <a href="/admin/news/edit" class="ix-btn ix-btn-primary ix-btn-sm" data-ix-perm="news.articles.create"><i class="ti ti-plus"></i> Tạo bài viết</a>
            </div>
          </div>
          <div class="ix-table-responsive">
            <table class="ix-table" id="art-table">
              <thead>
                <tr>
                  <th>Nguồn</th>
                  <th>Ngày đăng</th>
                  <th>Tiêu đề</th>
                  <th>Danh mục</th>
                  <th>Chủ đề</th>
                  <th>Chủ thể</th>
                  <th>Trạng thái</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="art-tbody">
                <tr><td colspan="8" style="text-align:center;padding:28px;color:var(--ix-text-muted);font-size:13px">Đang tải…</td></tr>
              </tbody>
            </table>
          </div>
          <div class="ix-pagination" id="art-pagination"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="ix-overlay" id="ix-overlay" style="display:none"></div>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-routes.js?v=seoLogoOnly20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-nav-registry.js?v=seoLogoOnly20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell.js?v=sub02p2-20260831"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-sidebar.js?v=sub02p2-20260831"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-header.js?v=sub02p2-20260831"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-theme.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/admin-auth.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/admin-rbac-client.js?v=seoLogoOnly20260810" data-ix-rbac=""></script>
<script src="/Admin_Design_system/app/news/content/article-list-page.js?v=authorSotWaveB20260810"></script>
</body>
</html>
