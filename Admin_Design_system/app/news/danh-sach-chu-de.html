<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADM-TOPIC — Danh sách Chủ đề · iFlux Admin</title>
  <link rel="preload" href="/Admin_Design_system/iflux-admin-ui/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/fonts.css" />
  <link rel="stylesheet" href="/platform/admin/admin.css?v=r20261002a" />
  <link rel="stylesheet" href="/Admin_Design_system/app/chu-de/chu-de-admin.css" />
  <style>
    .ix-modal-overlay { display: none; }
  </style>
</head>
<body>
<div class="ix-root">
  <div class="ix-layout">
    <aside class="ix-sidebar" data-ix-admin-shell="sidebar">
      <div class="ix-brand">
        <img class="ix-brand-logo" alt="iFlux" hidden />
        <span class="ix-brand-name">iFlux Admin</span>
      </div>
      <nav class="ix-menu" data-ix-admin-nav></nav>
    </aside>
    <main class="ix-main">
      <header class="ix-navbar" data-ix-admin-shell="header">
        <button class="ifx-nav-btn" data-ix-toggle="sidebar" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
        <div class="ix-search"><i class="ti ti-search"></i><input type="text" placeholder="Tìm kiếm (Ctrl+K)..." /></div>
        <div class="ifx-nav-actions"><span class="ix-chip ix-chip-warning">Môi trường local</span><div class="ix-avatar"></div></div>
      </header>
      <div class="ix-content">
        <h1 class="ix-page-title">Danh sách Chủ đề</h1>
        <div class="ix-breadcrumb ix-mb-24" id="adm-page-bc"></div>
        <p style="font-size:13px;color:var(--ix-text-muted);margin:-8px 0 20px">Chủ đề hình thành từ Hashtag Cộng đồng — sắp xếp theo điểm Engagement giảm dần. Ánh xạ sang Câu chuyện khi đủ chín.</p>
        <div class="ix-card">
          <div class="ix-filter-bar">
            <div class="ix-filter-row">
              <div><label class="ix-label">Khoảng thời gian</label>
                <select class="ix-select" id="adm-str-reg-range">
                  <option value="day">Ngày</option>
                  <option value="week" selected>Tuần</option>
                  <option value="month">Tháng</option>
                </select>
              </div>
              <div><label class="ix-label">Trạng thái</label>
                <select class="ix-select" id="adm-str-reg-status">
                  <option value="">Tất cả</option>
                  <option value="confirmed">Đã chính thức (≥100 lần)</option>
                  <option value="pending">Đang tích lũy</option>
                </select>
              </div>
            </div>
          </div>
          <div class="ix-table-toolbar">
            <div class="ix-table-search"><i class="ti ti-search"></i><input type="text" id="adm-str-reg-search" placeholder="Tìm tên chủ đề..." /></div>
          </div>
          <div class="ix-table-wrap">
            <table class="ix-table">
              <thead><tr>
                <th>Chủ đề</th><th>Trạng thái</th><th>Cổ phiếu đại diện</th><th>Like/Dislike</th><th>Comment</th><th>Share</th>
                <th>Engagement</th><th>Sentiment tác giả</th><th>Câu chuyện</th>
              </tr></thead>
              <tbody id="adm-str-reg-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="ix-overlay" id="ix-overlay" style="display:none"></div>

<div class="ix-modal-overlay" id="modal-topic-map">
  <div class="ix-modal-box" style="max-width:480px">
    <button type="button" class="ix-modal-close" data-ix-dismiss="modal"><i class="ti ti-x"></i></button>
    <div class="ix-modal-title">Ánh xạ sang Câu chuyện</div>
    <p style="font-size:13px;color:var(--ix-text-muted);margin:4px 0 16px">Chủ đề: <strong id="adm-topic-map-name"></strong></p>
    <div id="adm-topic-map-stocks" style="margin-bottom:16px"></div>
    <div class="ix-form-group">
      <label class="ix-label">Gắn vào Câu chuyện có sẵn (Story ID) — để trống để tạo Câu chuyện mới (tên lấy từ Chủ đề)</label>
      <input class="ix-input" id="adm-topic-map-story-id" placeholder="Dán Story ID nếu đã có" />
    </div>
    <div style="margin-top:20px;display:flex;gap:8px;justify-content:flex-end">
      <button type="button" class="ix-btn ix-btn-outline" data-ix-dismiss="modal">Huỷ</button>
      <button type="button" class="ix-btn ix-btn-primary" id="btn-topic-map-submit">Ánh xạ</button>
    </div>
  </div>
</div>

<script src="/Admin_Design_system/iflux-admin-ui/admin-auth.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/chu-de-registry-store.js?v=r20261008topic1"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-routes.js?v=r20260929a"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-nav-registry.js?v=r20260929a"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell.js?v=reqMenu20260723story"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-sidebar.js?v=groupTitle20260925"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-header.js?v=20260716plat1"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.js?v=r20260928p"></script>
<script src="/Admin_Design_system/app/chu-de/chu-de-registry-page.js?v=r20261008topic1"></script>
<script>AdmChuDeRegistry.init();</script>
</body>
</html>
