<!DOCTYPE html>
<html lang="vi">
<head>
  <script>try{var t=localStorage.getItem('iflux-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADM-COM-CAT-001 — Danh sách danh mục · iFlux Admin</title>
  <link rel="preload" href="/Admin_Design_system/iflux-admin-ui/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/fonts.css" />
<link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.css" />
  <style>
    .ix-offcanvas { transform: translateX(100%); }
  </style>
</head>
<body>
<div class="ix-root">
  <div class="ix-layout">
    <aside class="ix-sidebar" data-ix-admin-shell="sidebar">
      <div class="ix-brand">
        <img class="ix-brand-logo" alt="iFlux" hidden />
        <span class="ix-brand-name">iFlux Admin</span>
      </div>
      <nav class="ix-menu" data-ix-admin-nav></nav>
    </aside>
    <main class="ix-main">
      <header class="ix-navbar" data-ix-admin-shell="header">
        <button class="ix-nav-btn" data-ix-toggle="sidebar" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
        <div class="ix-search"><i class="ti ti-search"></i><input type="text" id="com-cat-search" placeholder="Tìm danh mục..." /></div>
        <div class="ix-nav-actions"><span class="ix-chip ix-chip-warning">Môi trường local</span><div class="ix-avatar"></div></div>
      </header>
      <div class="ix-content">
        <h1 class="ix-page-title">Danh sách danh mục</h1>
        <div class="ix-breadcrumb ix-mb-24" id="adm-page-bc"></div>
        <p style="font-size:13px;color:var(--ix-text-muted);margin:-8px 0 20px">Quản lý taxonomy bài viết Cộng đồng — thêm, sửa, xem, xóa. Hỗ trợ danh mục cha/con, SEO và nổi bật.</p>

        <div class="ix-card">
          <div class="ix-table-toolbar">
            <div style="font-size:13px;color:var(--ix-text-muted)">Tổng: <strong id="com-cat-count">0</strong> danh mục</div>
            <div style="display:flex;gap:8px;margin-left:auto">
              <button type="button" class="ix-btn ix-btn-primary ix-btn-sm" id="com-cat-add" data-ix-perm="news.categories.create"><i class="ti ti-plus"></i> Thêm danh mục</button>
            </div>
          </div>
          <div class="ix-table-responsive">
            <table class="ix-table">
              <thead>
                <tr>
                  <th>Thứ tự</th>
                  <th>Danh mục</th>
                  <th>Slug</th>
                  <th>Cha</th>
                  <th>Trạng thái</th>
                  <th>Nổi bật</th>
                  <th>Bài viết</th>
                  <th>Người tạo</th>
                  <th>Ngày tạo</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="com-cat-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="offcanvas-com-cat-overlay" class="ix-offcanvas-overlay"></div>

<div id="offcanvas-com-cat" class="ix-offcanvas">
  <div class="ix-offcanvas-header">
    <span class="ix-offcanvas-title" id="com-cat-modal-title">Thêm danh mục</span>
    <button type="button" class="ix-btn ix-btn-icon" data-ix-dismiss="offcanvas" aria-label="Đóng">
      <i class="ti ti-x" style="font-size:16px"></i>
    </button>
  </div>
  <div class="ix-offcanvas-body">
      <div class="ix-form-group">
        <label class="ix-label">Tên danh mục <span style="color:var(--ix-danger)">*</span></label>
        <input type="text" class="ix-input" id="com-cat-f-name" maxlength="160" />
      </div>
      <div class="ix-form-group">
        <label class="ix-label">Slug</label>
        <input type="text" class="ix-input" id="com-cat-f-slug" maxlength="160" placeholder="tự tạo từ tên nếu để trống" />
      </div>
      <div class="ix-form-group">
        <label class="ix-label">Mô tả</label>
        <textarea class="ix-input" id="com-cat-f-desc" rows="2"></textarea>
      </div>
      <div class="ix-form-group">
        <label class="ix-label">Icon (Tabler)</label>
        <input type="text" class="ix-input" id="com-cat-f-icon" placeholder="ti ti-news" />
      </div>
      <div class="ix-form-group">
        <label class="ix-label">Màu sắc</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="color" id="com-cat-f-color" value="#696CFF" style="width:42px;height:36px;padding:0;border:1px solid var(--ix-border);border-radius:var(--ix-radius);background:transparent" />
          <input type="text" class="ix-input" id="com-cat-f-color-text" value="#696CFF" maxlength="32" />
        </div>
      </div>
      <div class="ix-form-group">
        <label class="ix-label">Ảnh đại diện (URL, tuỳ chọn)</label>
        <input type="url" class="ix-input" id="com-cat-f-cover" placeholder="https://..." />
      </div>
      <div class="ix-form-group">
        <label class="ix-label">Danh mục cha</label>
        <select class="ix-select" id="com-cat-f-parent"><option value="">— Không —</option></select>
      </div>
      <div class="ix-form-group">
        <label class="ix-label">Thứ tự hiển thị</label>
        <input type="number" class="ix-input" id="com-cat-f-order" value="0" />
      </div>
      <div class="ix-form-group">
        <label class="ix-auth-check"><input type="checkbox" class="ix-checkbox" id="com-cat-f-visible" checked /> Hiển thị</label>
      </div>
      <div class="ix-form-group">
        <label class="ix-auth-check"><input type="checkbox" class="ix-checkbox" id="com-cat-f-featured" /> Nổi bật</label>
      </div>
      <div class="ix-form-group">
        <label class="ix-label">SEO Title</label>
        <input type="text" class="ix-input" id="com-cat-f-seo-title" maxlength="255" />
      </div>
      <div class="ix-form-group">
        <label class="ix-label">SEO Description</label>
        <textarea class="ix-input" id="com-cat-f-seo-desc" rows="2"></textarea>
      </div>
      <div class="ix-form-group">
        <label class="ix-label">SEO Keywords</label>
        <input type="text" class="ix-input" id="com-cat-f-seo-kw" placeholder="từ khóa, cách nhau bởi dấu phẩy" />
      </div>
      <div id="com-cat-view-meta" style="display:none;font-size:12px;color:var(--ix-text-muted);padding-top:8px;border-top:1px solid var(--ix-border)">
        <div>Số bài viết: <strong id="com-cat-v-posts">0</strong></div>
        <div>Ngày tạo: <span id="com-cat-v-created">—</span></div>
        <div>Người tạo: <span id="com-cat-v-creator">—</span></div>
      </div>
  </div>
  <div class="ix-offcanvas-footer">
    <button type="button" class="ix-btn ix-btn-outline" data-ix-dismiss="offcanvas">Huỷ</button>
    <button type="button" class="ix-btn ix-btn-primary" id="com-cat-modal-save">
      <i class="ti ti-check"></i> Lưu
    </button>
  </div>
</div>

<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-routes.js?v=seoLogoOnly20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-nav-registry.js?v=seoLogoOnly20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell.js?v=reqMenu20260723"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-sidebar.js?v=seoBrandLogo36px20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-header.js?v=20260716plat1"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-theme.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/admin-auth.js"></script>
<script src="/Admin_Design_system/app/news/news-categories-page.js?v=offcanvasForm20260725"></script>
</body>
</html>
