<!DOCTYPE html>
<html lang="vi">
<head>
  <script>try{var t=localStorage.getItem('iflux-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quy chuẩn hình ảnh · iFlux Admin</title>
  <link rel="preload" href="/Admin_Design_system/iflux-admin-ui/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/fonts.css" />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.css" />
</head>
<body>
<div class="ix-root">
  <div class="ix-layout">
    <aside class="ix-sidebar" data-ix-admin-shell="sidebar">
      <div class="ix-brand">
        <img class="ix-brand-logo" alt="iFlux" hidden />
        <span class="ix-brand-name">iFlux Admin</span>
      </div>
      <nav class="ix-menu" data-ix-admin-nav></nav>
    </aside>
    <main class="ix-main">
      <header class="ix-navbar" data-ix-admin-shell="header">
        <button class="ix-nav-btn" data-ix-toggle="sidebar" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
        <div class="ix-search"><i class="ti ti-search"></i><input type="text" placeholder="Tìm kiếm..." disabled /></div>
        <div class="ix-nav-actions"><div class="ix-avatar"></div></div>
      </header>
      <div class="ix-content">
        <h1 class="ix-page-title">Quy chuẩn hình ảnh</h1>
        <div class="ix-breadcrumb ix-mb-24" id="adm-page-bc"></div>
        <p class="ix-caption" style="margin:-8px 0 20px">Profile registry của Media Image Platform. Không phải danh sách file ảnh.</p>
        <div class="ix-card ix-mb-24" data-ix-perm="media.profile.manage">
          <div class="ix-card-header"><div class="ix-card-title" id="adm-mip-form-title">Tạo profile</div></div>
          <div class="ix-card-body">
            <input type="hidden" id="adm-mip-edit-key" value="" />
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
              <div class="ix-form-group" style="margin:0"><label class="ix-label">Key</label><input type="text" class="ix-input" id="adm-mip-key" placeholder="media-example" /></div>
              <div class="ix-form-group" style="margin:0"><label class="ix-label">Tên</label><input type="text" class="ix-input" id="adm-mip-name" /></div>
              <div class="ix-form-group" style="margin:0"><label class="ix-label">Mục đích</label><input type="text" class="ix-input" id="adm-mip-purpose" /></div>
              <div class="ix-form-group" style="margin:0"><label class="ix-label">Trạng thái</label>
                <select class="ix-input" id="adm-mip-status-field">
                  <option value="DRAFT" selected>DRAFT</option>
                  <option value="ACTIVE">ACTIVE</option>
                  <option value="DEPRECATED">DEPRECATED</option>
                  <option value="RETIRED">RETIRED</option>
                </select>
              </div>
              <div class="ix-form-group" style="margin:0"><label class="ix-label">Width</label><input type="number" class="ix-input" id="adm-mip-width" /></div>
              <div class="ix-form-group" style="margin:0"><label class="ix-label">Height</label><input type="number" class="ix-input" id="adm-mip-height" /></div>
              <div class="ix-form-group" style="margin:0"><label class="ix-label">Max width</label><input type="number" class="ix-input" id="adm-mip-maxw" /></div>
              <div class="ix-form-group" style="margin:0"><label class="ix-label">Quality</label><input type="number" class="ix-input" id="adm-mip-quality" value="82" /></div>
              <div class="ix-form-group" style="margin:0"><label class="ix-label">Crop</label>
                <select class="ix-input" id="adm-mip-crop">
                  <option value="none">none</option>
                  <option value="cover">cover</option>
                </select>
              </div>
              <div class="ix-form-group" style="margin:0"><label class="ix-label">Format</label>
                <select class="ix-input" id="adm-mip-format">
                  <option value="webp">webp</option>
                  <option value="jpeg">jpeg</option>
                  <option value="png">png</option>
                </select>
              </div>
            </div>
            <div style="margin-top:12px;display:flex;gap:8px">
              <button type="button" class="ix-btn ix-btn-primary ix-btn-sm" id="adm-mip-save" data-ix-perm="media.profile.manage">Tạo (DRAFT)</button>
              <button type="button" class="ix-btn ix-btn-outline ix-btn-sm" id="adm-mip-cancel" hidden>Hủy sửa</button>
            </div>
          </div>
        </div>
        <div class="ix-card">
          <div class="ix-table-responsive">
            <table class="ix-table">
              <thead>
                <tr>
                  <th>Key</th>
                  <th>Tên</th>
                  <th>Kích thước</th>
                  <th>Crop</th>
                  <th>Format</th>
                  <th>Quality</th>
                  <th>Version</th>
                  <th>Trạng thái</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="adm-mip-tbody"></tbody>
            </table>
          </div>
          <p id="adm-mip-status" class="ix-caption" style="padding:12px 16px"></p>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-routes.js?v=mip20260819p6"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-nav-registry.js?v=mip20260819p6"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell.js?v=mip20260819p6"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-sidebar.js?v=mip20260819p6"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-header.js?v=mip20260819p6"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/admin-auth.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/admin-rbac-client.js?v=mip20260819p6"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-theme.js"></script>
<script src="/Admin_Design_system/app/library/quy-chuan-hinh-anh.js?v=mip20260819p6"></script>
<script>AdmMediaProfiles.init();</script>
</body>
</html>
