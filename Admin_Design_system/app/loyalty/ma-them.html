<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thêm mã khuyến mãi · iFlux Admin</title>
  <link rel="preload" href="/Admin_Design_system/iflux-admin-ui/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/fonts.css" />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.css" />
  <script src="/Admin_Design_system/iflux-admin-ui/admin-auth.js"></script>
</head>
<body data-promo-page="add">
<div class="ix-root">
  <div class="ix-layout">
    <aside class="ix-sidebar" data-ix-admin-shell="sidebar">
      <div class="ix-brand">
        <img class="ix-brand-logo" alt="iFlux" hidden />
        <span class="ix-brand-name">iFlux Admin</span>
      </div>
      <nav class="ix-menu" data-ix-admin-nav></nav>
    </aside>
    <main class="ix-main">
      <header class="ix-navbar" data-ix-admin-shell="header">
        <button class="ix-nav-btn" data-ix-toggle="sidebar" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
        <div class="ix-search"><i class="ti ti-search"></i><input type="text" placeholder="Tìm kiếm..." disabled /></div>
        <div class="ix-nav-actions"><div class="ix-avatar"></div></div>
      </header>
      <div class="ix-content">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px">
          <div>
            <h1 class="ix-page-title" id="promo-page-title">Thêm mã khuyến mãi</h1>
            <div class="ix-breadcrumb" id="adm-page-bc"></div>
          </div>
          <div style="display:flex;gap:8px">
            <a href="/admin/membership/promo/list" class="ix-btn ix-btn-outline">Huỷ</a>
            <button type="button" class="ix-btn ix-btn-primary" id="btn-save-promo"><i class="ti ti-check"></i> Lưu</button>
          </div>
        </div>
        <div class="ix-card" style="padding:20px;max-width:640px">
          <div class="ix-form-group">
            <label class="ix-label">Loại mã</label>
            <select class="ix-select" id="promo-type">
              <option value="voucher">Voucher</option>
              <option value="coupon">Coupon</option>
            </select>
          </div>
          <div class="ix-form-group">
            <label class="ix-label">Mã</label>
            <input type="text" class="ix-input" id="promo-code" style="text-transform:uppercase;font-weight:700;letter-spacing:1px" autocomplete="off" />
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
            <div class="ix-form-group">
              <label class="ix-label" id="promo-value-label">Giá trị (%)</label>
              <input type="number" class="ix-input" id="promo-value" min="0" step="1" />
            </div>
            <div class="ix-form-group">
              <label class="ix-label" id="promo-max-label">Giá trị tối đa (₫)</label>
              <input type="number" class="ix-input" id="promo-max" min="0" step="1" />
            </div>
          </div>
          <div class="ix-form-group">
            <label class="ix-label">Giới hạn số lượng</label>
            <input type="number" class="ix-input" id="promo-qty" min="0" step="1" value="0" />
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
            <div class="ix-form-group">
              <label class="ix-label">Bắt đầu</label>
              <input type="date" class="ix-input" id="promo-starts" />
            </div>
            <div class="ix-form-group">
              <label class="ix-label">Kết thúc</label>
              <input type="date" class="ix-input" id="promo-ends" />
            </div>
          </div>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
            <input type="checkbox" class="ix-checkbox" id="promo-active" checked /> Đang bán
          </label>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-routes.js?v=seoLogoOnly20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-nav-registry.js?v=seoLogoOnly20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell.js?v=loyalty20260723"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-sidebar.js?v=seoBrandLogo36px20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-header.js?v=20260716plat1"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.js"></script>
<script src="/Admin_Design_system/app/loyalty/promo-catalog-store.js?v=loyalty20260723"></script>
<script src="/Admin_Design_system/app/loyalty/promo-page.js?v=loyalty20260723"></script>
</body>
</html>
