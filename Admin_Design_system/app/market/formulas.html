<html lang="vi">
<head>
  <script>try{var t=localStorage.getItem('iflux-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADM-MKT-006 — Công thức · iFlux Admin</title>
  <link rel="preload" href="/Admin_Design_system/iflux-admin-ui/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/fonts.css" />
<link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.css" />
  <script src="/Admin_Design_system/iflux-admin-ui/admin-auth.js"></script>
  <style>
    .ix-modal-overlay { display: none; }
    .ix-offcanvas { transform: translateX(100%); }
    .ix-offcanvas.open { transform: translateX(0); }
  </style>
</head>
<body data-ix-view-api="/admin/market-config/formulas">
<div class="ix-root">
  <div class="ix-layout">
<aside class="ix-sidebar" data-ix-admin-shell="sidebar">
      <div class="ix-brand">
        <img class="ix-brand-logo" alt="iFlux" hidden />
        <span class="ix-brand-name">iFlux Admin</span>
      </div>
      <nav class="ix-menu" data-ix-admin-nav></nav>
    </aside>
    <main class="ix-main">
      <header class="ix-navbar" data-ix-admin-shell="header">
        <button class="ix-nav-btn" data-ix-toggle="sidebar" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
        <div class="ix-search"><i class="ti ti-search"></i><input type="text" placeholder="Tìm kiếm (Ctrl+K)..." /></div>
        <div class="ix-nav-actions"><span class="ix-chip ix-chip-warning">Môi trường local</span><div class="ix-avatar"></div></div>
      </header>
      <div class="ix-content">

        <h1>Công thức tính điểm</h1>
        <div class="ix-breadcrumb ix-mb-24" id="adm-page-bc"></div>
        <div style="display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,1fr);gap:20px;align-items:start">
          <div class="ix-card">
            <div class="ix-filter-bar" style="border-bottom:none;padding-bottom:0">
              <div class="ix-filter-row">
                <div><label class="ix-label">Danh mục</label><select class="ix-select" id="adm-mkt-formula-filter-category"><option value="">Tất cả</option><option value="market_data">Thị trường</option><option value="flow">Dòng tiền</option><option value="ranking">Xếp hạng</option></select></div>
                <div><label class="ix-label">Trạng thái</label><select class="ix-select" id="adm-mkt-formula-filter-status"><option value="">Tất cả</option><option value="active">Active</option><option value="draft">Draft</option></select></div>
              </div>
            </div>
            <div class="ix-table-toolbar"><div class="ix-table-search"><i class="ti ti-search"></i><input type="text" id="adm-mkt-formula-search" placeholder="Tìm key, tên..." /></div></div>
            <div class="ix-table-wrap">
              <table class="ix-table">
                <thead><tr><th>Formula Key</th><th>Tên</th><th>Version</th><th>Trạng thái</th><th>Cập nhật</th><th></th></tr></thead>
                <tbody id="adm-mkt-formula-tbody"></tbody>
              </table>
            </div>
          </div>
          <div class="ix-card" id="adm-mkt-formula-detail">
            <div class="ix-card-header"><div class="ix-card-title">Chi tiết công thức</div></div>
            <div class="ix-card-body">
              <ul class="ix-detail-list">
                <li><span class="ix-detail-label">Key</span><span class="ix-detail-val" id="adm-mkt-formula-detail-key">—</span></li>
                <li><span class="ix-detail-label">Tên</span><span class="ix-detail-val" id="adm-mkt-formula-detail-name">—</span></li>
                <li><span class="ix-detail-label">Version</span><span class="ix-detail-val" id="adm-mkt-formula-detail-version">—</span></li>
                <li><span class="ix-detail-label">Trạng thái</span><span class="ix-detail-val" id="adm-mkt-formula-detail-status">—</span></li>
                <li><span class="ix-detail-label">Danh mục</span><span class="ix-detail-val" id="adm-mkt-formula-detail-category">—</span></li>
                <li><span class="ix-detail-label">Mô tả</span><span class="ix-detail-val" id="adm-mkt-formula-detail-desc">—</span></li>
                <li><span class="ix-detail-label">Cập nhật</span><span class="ix-detail-val" id="adm-mkt-formula-detail-updated">—</span></li>
              </ul>
              <div style="margin-top:12px" id="adm-mkt-formula-detail-text">—</div>
              <button type="button" class="ix-btn ix-btn-primary ix-btn-sm" id="btn-adm-mkt-formula-activate" data-ix-perm="market.formulas.edit" style="margin-top:16px" hidden>Kích hoạt version</button>
              <button type="button" class="ix-btn ix-btn-outline ix-btn-sm" id="btn-adm-mkt-formula-recalc" data-ix-perm="market.formulas.recalculate" style="margin-top:8px" hidden>Tính lại</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="ix-overlay" id="ix-overlay" style="display:none"></div>
