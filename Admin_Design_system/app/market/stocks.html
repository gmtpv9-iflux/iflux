<!DOCTYPE html>
<html lang="vi">
<head>
  <script>try{var t=localStorage.getItem('iflux-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADM-MKT-000 — Mã cổ phiếu · iFlux Admin</title>
  <link rel="preload" href="/Admin_Design_system/iflux-admin-ui/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/fonts.css" />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.css?v=sub02p2c-20260831" />
  <style>
    .ix-modal-overlay { display: none; }
    .ix-offcanvas { transform: translateX(100%); }
    .ix-offcanvas.open { transform: translateX(0); }
  </style>
</head>
<body>
<div class="ix-root">
  <div class="ix-layout">
<aside class="ix-sidebar" data-ix-admin-shell="sidebar">
      <div class="ix-brand">
        <img class="ix-brand-logo" alt="iFlux" hidden />
        <span class="ix-brand-name">iFlux Admin</span>
      </div>
      <nav class="ix-menu" data-ix-admin-nav></nav>
    </aside>
    <main class="ix-main">
      <header class="ix-navbar" data-ix-admin-shell="header">
        <button class="ix-nav-btn" data-ix-toggle="sidebar" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
        <div class="ix-search"><i class="ti ti-search"></i><input type="text" placeholder="Tìm kiếm (Ctrl+K)..." /></div>
        <div class="ix-nav-actions"><span class="ix-chip ix-chip-warning">Môi trường local</span><div class="ix-avatar"></div></div>
      </header>
      <div class="ix-content">

        <h1 class="ix-page-title">Mã cổ phiếu</h1>
        <div class="ix-breadcrumb ix-mb-24" id="adm-page-bc"></div>
        <p class="ix-caption" style="margin:-8px 0 20px">Ticker là khóa bất biến — quản lý metadata từng mã cổ phiếu.</p>
        <div class="ix-grid ix-grid-3 ix-mb-24">
          <div class="ix-stat-card-h"><div class="ix-stat-info"><div class="ix-stat-label">Tổng mã</div><div class="ix-stat-value" id="adm-mkt-stat-total">—</div></div><div class="ix-stat-icon accent"><i class="ti ti-building-bank"></i></div></div>
          <div class="ix-stat-card-h"><div class="ix-stat-info"><div class="ix-stat-label">Đang giao dịch</div><div class="ix-stat-value" id="adm-mkt-stat-active">—</div></div><div class="ix-stat-icon success"><i class="ti ti-circle-check"></i></div></div>
          <div class="ix-stat-card-h"><div class="ix-stat-info"><div class="ix-stat-label">Tạm ngưng</div><div class="ix-stat-value" id="adm-mkt-stat-halted">—</div></div><div class="ix-stat-icon warning"><i class="ti ti-player-pause"></i></div></div>
        </div>
        <div class="ix-card">
          <div class="ix-filter-bar">
            <div class="ix-filter-bar-title">Bộ lọc</div>
            <div class="ix-filter-row">
              <div><label class="ix-label">Sàn</label><select class="ix-select" id="adm-mkt-filter-exchange"><option value="">Tất cả</option><option value="HOSE">HOSE</option><option value="HNX">HNX</option><option value="UPCOM">UPCOM</option></select></div>
              <div><label class="ix-label">Ngành</label><select class="ix-select" id="adm-mkt-filter-sector"><option value="">Tất cả ngành</option></select></div>
              <div><label class="ix-label">Hệ sinh thái</label><select class="ix-select" id="adm-mkt-filter-ecosystem"><option value="">Tất cả hệ sinh thái</option></select></div>
              <div><label class="ix-label">Nhóm vốn hóa</label><select class="ix-select" id="adm-mkt-filter-capTier"><option value="">Tất cả</option><option value="large">Lớn</option><option value="medium">Trung bình</option><option value="small">Nhỏ</option></select></div>
              <div><label class="ix-label">Trạng thái</label><select class="ix-select" id="adm-mkt-filter-status"><option value="">Tất cả</option><option value="active">Hoạt động</option><option value="halted">Tạm ngưng</option><option value="delisted">Hủy niêm yết</option></select></div>
            </div>
          </div>
          <div class="ix-table-toolbar">
            <div class="ix-table-search"><i class="ti ti-search"></i><input type="text" id="adm-mkt-stocks-search" placeholder="Tìm ticker, tên công ty..." /></div>
          </div>
          <div class="ix-table-wrap">
            <table class="ix-table">
              <thead><tr><th>Ticker</th><th>Tên</th><th>Sàn</th><th>Ngành</th><th>Hệ sinh thái</th><th>Thị giá</th><th>Tăng/giảm</th><th>OHLC</th><th>Vốn hóa</th><th>Nhóm VH</th><th>Trạng thái</th><th>Cập nhật</th><th></th></tr></thead>
              <tbody id="adm-mkt-stocks-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="ix-overlay" id="ix-overlay" style="display:none"></div>

<div class="ix-offcanvas" id="offcanvas-edit-stock">
  <div class="ix-offcanvas-header"><span class="ix-offcanvas-title">Sửa metadata mã</span><button type="button" class="ix-offcanvas-close" data-ix-dismiss="offcanvas" id="btn-adm-mkt-close-stock"><i class="ti ti-x"></i></button></div>
  <div class="ix-offcanvas-body">
    <div class="ix-form-group"><label class="ix-label">Ticker</label><input type="text" class="ix-input" id="adm-mkt-edit-ticker" readonly /></div>
    <div class="ix-form-group"><label class="ix-label">Tên công ty</label><input type="text" class="ix-input" id="adm-mkt-edit-name" /></div>
    <div class="ix-form-group"><label class="ix-label">Sàn</label><select class="ix-select" id="adm-mkt-edit-exchange"><option value="HOSE">HOSE</option><option value="HNX">HNX</option><option value="UPCOM">UPCOM</option></select></div>
    <div class="ix-form-group"><label class="ix-label">Ngành</label><select class="ix-select" id="adm-mkt-edit-sector"></select></div>
    <div class="ix-form-group"><label class="ix-label">Hệ sinh thái</label><select class="ix-select" id="adm-mkt-edit-ecosystem"></select></div>
    <div class="ix-form-group"><label class="ix-label">Nhóm vốn hóa</label><select class="ix-select" id="adm-mkt-edit-capTier"><option value="">— Chưa gán —</option><option value="large">Lớn</option><option value="medium">Trung bình</option><option value="small">Nhỏ</option></select></div>
    <div class="ix-form-group"><label class="ix-label">Trạng thái</label><select class="ix-select" id="adm-mkt-edit-status"><option value="active">Hoạt động</option><option value="halted">Tạm ngưng</option><option value="delisted">Hủy niêm yết</option></select></div>
    <div class="ix-form-group"><label class="ix-label">Mô tả</label><textarea class="ix-input" id="adm-mkt-edit-description" rows="3"></textarea></div>
    <div style="display:flex;gap:8px">
      <button type="button" class="ix-btn ix-btn-primary" id="btn-adm-mkt-save-stock">Lưu thay đổi</button>
      <button type="button" class="ix-btn ix-btn-outline" id="btn-adm-mkt-cancel-stock" data-ix-dismiss="offcanvas">Đóng</button>
    </div>
  </div>
</div>

<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-routes.js?v=seoLogoOnly20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-nav-registry.js?v=seoLogoOnly20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell.js?v=sub02p2c-20260831"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-sidebar.js?v=sub02p2c-20260831"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-header.js?v=sub02p2c-20260831"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/admin-auth.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-theme.js"></script>
<script src="/User_Web/iflux-web-ui/iflux-market-quotes.js"></script>
<script src="/Admin_Design_system/app/market/market-stocks-page.js?v=stockSave20260808"></script>
<script>
  AdmMarketStocks.init();
</script>
</body>
</html>
