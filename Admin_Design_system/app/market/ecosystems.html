<!DOCTYPE html>
<html lang="vi">
<head>
  <script>try{var t=localStorage.getItem('iflux-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADM-MKT-001 — Hệ sinh thái · iFlux Admin</title>
  <link rel="preload" href="/Admin_Design_system/iflux-admin-ui/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/fonts.css" />
  <link rel="stylesheet" href="../../iflux-admin-ui/iflux-admin-ui.css" />
  <style>
    .ix-modal-overlay { display: none; }
    .ix-offcanvas { transform: translateX(100%); }
    .ix-offcanvas.open { transform: translateX(0); }
  </style>
</head>
<body>
<div class="ix-root">
  <div class="ix-layout">
    <aside class="ix-sidebar" data-ix-admin-shell="sidebar">
      <div class="ix-brand">
        <div class="ix-brand-logo"><svg width="18" height="18" viewBox="0 0 32 22" fill="white"><path fill-rule="evenodd" d="M0 0v6.85c0 0-.13 2.16 1.98 3.99L13.69 22l6.09-.08L18.8 9.88l-2.31-2.71L9.24 0H0z"/><path fill-rule="evenodd" d="M7.7 16.44L23.66 0H32v6.88c0 0-.17 2.29-1.34 3.52L19.78 22h-6.09L7.7 16.44z"/></svg></div>
        <span class="ix-brand-name">iFlux Admin</span>
      </div>
      <nav class="ix-menu" data-ix-admin-nav></nav>
    </aside>
    <main class="ix-main">
      <header class="ix-navbar" data-ix-admin-shell="header">
        <button class="ix-nav-btn" data-ix-toggle="sidebar" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
        <div class="ix-search"><i class="ti ti-search"></i><input type="text" placeholder="Tìm kiếm (Ctrl+K)..." /></div>
        <div class="ix-nav-actions"><span class="ix-chip ix-chip-warning">Môi trường local</span><div class="ix-avatar"></div></div>
      </header>
      <div class="ix-content">
        <h1 class="ix-page-title">Hệ sinh thái</h1>
        <div class="ix-breadcrumb ix-mb-24">
          <a href="../../hub.html">Admin</a><i class="ti ti-chevron-right" style="font-size:12px"></i>
          <span>Thị trường</span><i class="ti ti-chevron-right" style="font-size:12px"></i>
          <span>Hệ sinh thái</span>
        </div>
        <p class="ix-caption" style="margin:-8px 0 20px">Quản lý nhóm mã theo hệ sinh thái. Thêm, sửa, bật/tắt và xóa.</p>
        <div class="ix-card">
          <div class="ix-filter-bar">
            <div class="ix-filter-row">
              <div>
                <label class="ix-label">Trạng thái</label>
                <select class="ix-select" id="adm-mkt-eco-filter-status">
                  <option value="">Tất cả</option>
                  <option value="active">Hoạt động</option>
                  <option value="inactive">Tắt</option>
                </select>
              </div>
            </div>
          </div>
          <div class="ix-table-toolbar">
            <div class="ix-table-search"><i class="ti ti-search"></i><input type="text" id="adm-mkt-eco-search" placeholder="Tìm hệ sinh thái..." /></div>
            <div class="ix-table-actions">
              <button type="button" class="ix-btn ix-btn-primary ix-btn-sm" id="btn-adm-mkt-eco-add" data-ix-perm="market.ecosystems.create">
                <i class="ti ti-plus"></i> Thêm hệ sinh thái
              </button>
            </div>
          </div>
          <div class="ix-table-wrap">
            <table class="ix-table">
              <thead>
                <tr>
                  <th>Tên</th>
                  <th>Số CP</th>
                  <th>Số bài viết</th>
                  <th>Divisor</th>
                  <th>Trạng thái</th>
                  <th>Cập nhật</th>
                  <th>Thao tác</th>
                </tr>
              </thead>
              <tbody id="adm-mkt-eco-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="ix-overlay" id="ix-overlay" style="display:none"></div>

<div class="ix-modal-overlay" id="modal-eco-form">
  <div class="ix-modal-box" style="max-width:480px">
    <button type="button" class="ix-modal-close" data-ix-dismiss="modal"><i class="ti ti-x"></i></button>
    <div class="ix-modal-title" id="adm-mkt-eco-modal-title">Thêm hệ sinh thái</div>
    <div class="ix-form-group" style="margin-top:16px">
      <label class="ix-label">Tên hệ sinh thái</label>
      <input type="text" class="ix-input" id="adm-mkt-eco-name" placeholder="VD: Họ Hòa Phát" />
    </div>
    <div class="ix-form-group">
      <label class="ix-label">Danh sách mã (phân cách bằng dấu phẩy)</label>
      <textarea class="ix-input" id="adm-mkt-eco-tickers" rows="3" placeholder="HPG, HSG, NKG"></textarea>
    </div>
    <div class="ix-form-group">
      <label class="ix-label">Trạng thái</label>
      <select class="ix-select" id="adm-mkt-eco-status">
        <option value="active">Hoạt động</option>
        <option value="inactive">Tắt</option>
      </select>
    </div>
    <div style="margin-top:20px;display:flex;gap:8px;justify-content:flex-end">
      <button type="button" class="ix-btn ix-btn-outline" data-ix-dismiss="modal">Huỷ</button>
      <button type="button" class="ix-btn ix-btn-primary" id="btn-adm-mkt-eco-save" data-ix-perm="market.ecosystems.edit">Lưu</button>
    </div>
  </div>
</div>

<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-routes.js?v=ecoC620260727"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-nav-registry.js?v=menuFix20260725"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell.js?v=ecoC620260727"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-sidebar.js?v=menuFix20260725"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-header.js?v=20260716plat1"></script>
<script src="../../iflux-admin-ui/iflux-admin-ui.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/admin-auth.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-theme.js"></script>
<script src="market-ecosystems-page.js?v=ecoC620260727"></script>
<script>AdmMarketEcosystems.init();</script>
</body>
</html>
