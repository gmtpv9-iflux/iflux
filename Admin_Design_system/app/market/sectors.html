<!DOCTYPE html>
<html lang="vi">
<head>
  <script>try{var t=localStorage.getItem('iflux-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADM-MKT-003 — Quản lý ngành · iFlux Admin</title>
  <link rel="preload" href="/Admin_Design_system/iflux-admin-ui/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/fonts.css" />
<link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.css" />
  <style>
    .ix-modal-overlay { display: none; }
    .ix-offcanvas { transform: translateX(100%); }
    .ix-offcanvas.open { transform: translateX(0); }
  </style>
</head>
<body>
<div class="ix-root">
  <div class="ix-layout">
<aside class="ix-sidebar" data-ix-admin-shell="sidebar">
      <div class="ix-brand">
        <img class="ix-brand-logo" alt="iFlux" hidden />
        <span class="ix-brand-name">iFlux Admin</span>
      </div>
      <nav class="ix-menu" data-ix-admin-nav></nav>
    </aside>
    <main class="ix-main">
      <header class="ix-navbar" data-ix-admin-shell="header">
        <button class="ix-nav-btn" data-ix-toggle="sidebar" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
        <div class="ix-search"><i class="ti ti-search"></i><input type="text" placeholder="Tìm kiếm (Ctrl+K)..." /></div>
        <div class="ix-nav-actions"><span class="ix-chip ix-chip-warning">Môi trường local</span><div class="ix-avatar"></div></div>
      </header>
      <div class="ix-content">

        <h1>Quản lý ngành</h1>
        <div class="ix-breadcrumb ix-mb-24"><a href="/Admin_Design_system/hub.html">Admin</a><i class="ti ti-chevron-right" style="font-size:12px"></i><span>Thị trường</span><i class="ti ti-chevron-right" style="font-size:12px"></i><span>Ngành</span></div>
        <div class="ix-card">
          <div class="ix-table-toolbar">
            <div class="ix-table-search"><i class="ti ti-search"></i><input type="text" id="adm-mkt-sector-search" placeholder="Tìm ngành..." /></div>
            <div class="ix-table-actions"><button type="button" class="ix-btn ix-btn-primary ix-btn-sm" id="btn-adm-mkt-sector-add" data-ix-perm="market.sectors.create"><i class="ti ti-plus"></i> Thêm ngành</button></div>
          </div>
          <div class="ix-table-wrap">
            <table class="ix-table">
              <thead><tr><th>Tên ngành</th><th>Số CP</th><th>Số bài viết</th><th>Trạng thái</th><th>Cập nhật</th><th>Thao tác</th></tr></thead>
              <tbody id="adm-mkt-sector-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="ix-overlay" id="ix-overlay" style="display:none"></div>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-routes.js?v=seoLogoOnly20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-nav-registry.js?v=seoLogoOnly20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell.js?v=sectorsC520260726"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-sidebar.js?v=seoBrandLogo36px20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-header.js?v=20260716plat1"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/admin-auth.js"></script>
<script src="/Admin_Design_system/app/market/market-sectors-page.js?v=sectorsAbs20260808"></script>
<script>AdmMarketSectors.init();</script>

<div class="ix-offcanvas" id="offcanvas-sector-form">
  <div class="ix-offcanvas-header">
    <span class="ix-offcanvas-title" id="adm-mkt-sector-modal-title">Thêm ngành</span>
    <button type="button" class="ix-offcanvas-close" data-ix-dismiss="offcanvas"><i class="ti ti-x"></i></button>
  </div>
  <div class="ix-offcanvas-body">
    <div class="ix-form-group"><label class="ix-label">Tên ngành</label><input type="text" class="ix-input" id="adm-mkt-sector-name" /></div>
    <div class="ix-form-group"><label class="ix-label">Mô tả</label><textarea class="ix-input" id="adm-mkt-sector-desc" rows="3"></textarea></div>
    <div class="ix-form-group"><label class="ix-label">Trạng thái</label><select class="ix-select" id="adm-mkt-sector-status"><option value="active">Hoạt động</option><option value="inactive">Tắt</option></select></div>
    <button type="button" class="ix-btn ix-btn-primary" id="btn-adm-mkt-sector-save" data-ix-perm="market.sectors.edit">Lưu</button>
  </div>
</div>

<div class="ix-offcanvas" id="offcanvas-sector-stocks">
  <div class="ix-offcanvas-header">
    <span class="ix-offcanvas-title" id="adm-mkt-sector-stocks-title">Thêm cổ phiếu vào ngành</span>
    <button type="button" class="ix-offcanvas-close" data-ix-dismiss="offcanvas"><i class="ti ti-x"></i></button>
  </div>
  <div class="ix-offcanvas-body">
    <p class="ix-caption" style="margin:0 0 12px">Nhập ticker cách nhau bởi dấu phẩy hoặc xuống dòng. Thành viên ngành = <code>stocks.sector_id</code>.</p>
    <div class="ix-form-group">
      <label class="ix-label">Danh sách mã</label>
      <textarea class="ix-input" id="adm-mkt-sector-tickers" rows="8" placeholder="HPG, VCB, FPT"></textarea>
    </div>
    <button type="button" class="ix-btn ix-btn-primary" id="btn-adm-mkt-sector-stocks-save" data-ix-perm="market.sectors.edit">Lưu danh sách mã</button>
  </div>
</div>
  <script src="/Admin_Design_system/iflux-admin-ui/iflux-theme.js"></script>
</body>
</html>
