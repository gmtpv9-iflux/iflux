<!DOCTYPE html>
<html lang="vi">
<head>
  <script>try{var t=localStorage.getItem('iflux-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADM-MKT-005 — Cấu hình xếp hạng · iFlux Admin</title>
  <link rel="preload" href="/Admin_Design_system/iflux-admin-ui/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/fonts.css" />
<link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.css" />
  <script src="/Admin_Design_system/iflux-admin-ui/admin-auth.js"></script>
  <style>
    .ix-modal-overlay { display: none; }
    .ix-offcanvas { transform: translateX(100%); }
    .ix-offcanvas.open { transform: translateX(0); }
  </style>
</head>
<body data-ix-view-api="/admin/market-config/ranking">
<div class="ix-root">
  <div class="ix-layout">
<aside class="ix-sidebar" data-ix-admin-shell="sidebar">
      <div class="ix-brand">
        <img class="ix-brand-logo" alt="iFlux" hidden />
        <span class="ix-brand-name">iFlux Admin</span>
      </div>
      <nav class="ix-menu" data-ix-admin-nav></nav>
    </aside>
    <main class="ix-main">
      <header class="ix-navbar" data-ix-admin-shell="header">
        <button class="ix-nav-btn" data-ix-toggle="sidebar" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
        <div class="ix-search"><i class="ti ti-search"></i><input type="text" placeholder="Tìm kiếm (Ctrl+K)..." /></div>
        <div class="ix-nav-actions"><span class="ix-chip ix-chip-warning">Môi trường local</span><div class="ix-avatar"></div></div>
      </header>
      <div class="ix-content">

        <h1>Cấu hình xếp hạng</h1>
        <div class="ix-breadcrumb ix-mb-24" id="adm-page-bc"></div>
        <div class="ix-card" style="max-width:720px">
          <div class="ix-card-header"><div class="ix-card-title">Trọng số thành phần (%)</div></div>
          <div class="ix-card-body">
            <p id="adm-mkt-rank-weight-warning" style="font-size:13px;color:var(--ix-warning);margin:0 0 12px;display:none">Tổng trọng số phải bằng 100%</p>
            <p style="font-size:13px;color:var(--ix-text-muted);margin:0 0 16px">Tổng hiện tại: <strong id="adm-mkt-rank-weight-sum">0</strong>%</p>
            <div class="ix-form-group"><label class="ix-label">Hiệu suất (PG)</label><div style="display:flex;gap:12px;align-items:center"><input type="range" id="adm-mkt-rank-w-performance-slider" min="0" max="100" style="flex:1" /><input type="number" class="ix-input" id="adm-mkt-rank-w-performance" min="0" max="100" style="width:80px" /></div></div>
            <div class="ix-form-group"><label class="ix-label">Dòng tiền</label><div style="display:flex;gap:12px;align-items:center"><input type="range" id="adm-mkt-rank-w-flow-slider" min="0" max="100" style="flex:1" /><input type="number" class="ix-input" id="adm-mkt-rank-w-flow" min="0" max="100" style="width:80px" /></div></div>
            <div class="ix-form-group"><label class="ix-label">Khối lượng</label><div style="display:flex;gap:12px;align-items:center"><input type="range" id="adm-mkt-rank-w-volume-slider" min="0" max="100" style="flex:1" /><input type="number" class="ix-input" id="adm-mkt-rank-w-volume" min="0" max="100" style="width:80px" /></div></div>
            <hr style="border:none;border-top:1px solid var(--ix-border);margin:20px 0" />
            <div class="ix-form-group"><label class="ix-label">Lookback hiệu suất (ngày)</label><input type="number" class="ix-input" id="adm-mkt-rank-lookback" min="1" max="365" style="max-width:120px" /></div>
            <div class="ix-form-group"><label class="ix-label">Lookback dòng tiền (ngày)</label><input type="number" class="ix-input" id="adm-mkt-rank-flow-lookback" min="1" max="90" style="max-width:120px" /></div>
            <div class="ix-form-group"><label class="ix-label">Thanh khoản tối thiểu (VND)</label><input type="text" class="ix-input" id="adm-mkt-rank-min-liquidity" style="max-width:200px" /></div>
            <div class="ix-form-group"><label class="ix-label">Top N ngành hiển thị</label><input type="number" class="ix-input" id="adm-mkt-rank-sector-topn" min="1" max="50" style="max-width:120px" /></div>
            <button type="button" class="ix-btn ix-btn-primary" id="btn-adm-mkt-rank-save" data-ix-perm="market.ranking.edit"><i class="ti ti-device-floppy"></i> Lưu cấu hình</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="ix-overlay" id="ix-overlay" style="display:none"></div>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-market-seed-data.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-market-ecosystem-seeds.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-market-registry-store.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-routes.js?v=seoLogoOnly20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-nav-registry.js?v=seoLogoOnly20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell.js?v=reqMenu20260723"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-sidebar.js?v=seoBrandLogo36px20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-header.js?v=20260716plat1"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.js"></script>
<script src="/Admin_Design_system/app/market/market-ranking-page.js"></script>
<script>AdmMarketRanking.init();</script>
  <script src="/Admin_Design_system/iflux-admin-ui/iflux-theme.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/admin-view-gate.js?v=waveB20260727"></script>
</body>
</html>
