<script>
  // Highlight mục Giao diện tương ứng với trang DS đang mở (theo hash) trong sidebar admin.
  (function () {
    function syncActive() {
      var hash = location.hash || '#page-primitive-tokens';
      document.querySelectorAll('.ix-menu .ix-menu-item').forEach(function (a) {
        var href = a.getAttribute('href') || '';
        var isDs = href.indexOf('ds-studio.html') >= 0;
        a.classList.toggle('active', isDs && href.indexOf(hash) >= 0);
      });
    }
    window.addEventListener('hashchange', syncActive);
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', syncActive);
    else syncActive();
  })();
</script>
