<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hồ sơ · iFlux Admin</title>
  <link rel="preload" href="/Admin_Design_system/iflux-admin-ui/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/fonts.css" />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.css" />
  <script src="/Admin_Design_system/iflux-admin-ui/admin-auth.js"></script>
</head>
<body data-admin-gov="profile">
<div class="ix-root">
  <div class="ix-layout">
    <aside class="ix-sidebar" data-ix-admin-shell="sidebar">
      <div class="ix-brand">
        <div class="ix-brand-logo"><svg width="18" height="18" viewBox="0 0 32 22" fill="white"><path fill-rule="evenodd" d="M0 0v6.85c0 0-.13 2.16 1.98 3.99L13.69 22l6.09-.08L18.8 9.88l-2.31-2.71L9.24 0H0z"/><path fill-rule="evenodd" d="M7.7 16.44L23.66 0H32v6.88c0 0-.17 2.29-1.34 3.52L19.78 22h-6.09L7.7 16.44z"/></svg></div>
        <span class="ix-brand-name">iFlux Admin</span>
      </div>
      <nav class="ix-menu" data-ix-admin-nav></nav>
    </aside>
    <main class="ix-main">
      <header class="ix-navbar" data-ix-admin-shell="header">
        <button class="ix-nav-btn" data-ix-toggle="sidebar" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
        <div class="ix-search"><i class="ti ti-search"></i><input type="text" placeholder="Tìm kiếm..." disabled /></div>
        <div class="ix-nav-actions"><div class="ix-avatar"></div></div>
      </header>
      <div class="ix-content">
        <h1 class="ix-page-title">Hồ sơ</h1>
        <div class="ix-breadcrumb ix-mb-24">
          <a href="/Admin_Design_system/hub.html">Admin</a><i class="ti ti-chevron-right" style="font-size:12px"></i>
          <span>Hệ thống</span><i class="ti ti-chevron-right" style="font-size:12px"></i>
          <span>Quản trị viên</span><i class="ti ti-chevron-right" style="font-size:12px"></i>
          <span>Hồ sơ</span>
        </div>
        <p style="color:var(--ix-text-muted);font-size:13px;margin-bottom:20px">Quản lý hồ sơ cá nhân của bạn: thông tin định danh và đổi mật khẩu. Vai trò / cấp truy cập do hệ thống gán — chỉ xem tại đây.</p>

        <div class="ix-grid ix-grid-2" style="gap:20px;align-items:start">
          <div class="ix-card" style="padding:20px">
            <h2 class="ix-h2" style="margin-bottom:16px">Thông tin định danh</h2>
            <div class="ix-form-group">
              <label class="ix-label">Họ tên</label>
              <input type="text" class="ix-input" id="prof-name" />
            </div>
            <div class="ix-form-group">
              <label class="ix-label">Email</label>
              <input type="email" class="ix-input" id="prof-email" readonly />
              <div class="ix-field-hint">Email đăng nhập — không đổi tại đây.</div>
            </div>
            <div class="ix-form-group">
              <label class="ix-label">Mã tài khoản</label>
              <div id="prof-id" style="font-size:13px;color:var(--ix-text-muted)">—</div>
            </div>
            <button type="button" class="ix-btn ix-btn-primary" id="btn-save-profile"><i class="ti ti-device-floppy"></i> Lưu hồ sơ</button>
          </div>

          <div class="ix-card" style="padding:20px">
            <h2 class="ix-h2" style="margin-bottom:16px">Thông tin truy cập</h2>
            <div class="ix-form-group">
              <label class="ix-label">Cấp truy cập</label>
              <div id="prof-super">—</div>
            </div>
            <div class="ix-form-group">
              <label class="ix-label">Vai trò được gán</label>
              <div id="prof-roles" style="display:flex;flex-wrap:wrap;gap:6px">—</div>
            </div>
            <hr style="border:none;border-top:1px solid var(--ix-border);margin:20px 0" />
            <h2 class="ix-h2" style="margin-bottom:12px">Đổi mật khẩu</h2>
            <div class="ix-form-group"><label class="ix-label">Mật khẩu hiện tại</label><input type="password" class="ix-input" id="prof-pw-current" autocomplete="current-password" /></div>
            <div class="ix-form-group"><label class="ix-label">Mật khẩu mới</label><input type="password" class="ix-input" id="prof-pw-new" autocomplete="new-password" /></div>
            <div class="ix-form-group"><label class="ix-label">Xác nhận mật khẩu mới</label><input type="password" class="ix-input" id="prof-pw-confirm" autocomplete="new-password" /></div>
            <button type="button" class="ix-btn ix-btn-outline" id="btn-change-password"><i class="ti ti-key"></i> Đổi mật khẩu</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-routes.js?v=adminGov20260723"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-nav-registry.js?v=adminProfile20260725"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell.js?v=adminGov20260723"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-sidebar.js?v=adminProfile20260725"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-header.js?v=adminGov20260723"></script>
<script src="/Admin_Design_system/iflux-admin-ui/admin-rbac-client.js?v=adminProfile20260725"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.js"></script>
<script src="/Admin_Design_system/app/system/admin-governance.js?v=adminProfile20260725"></script>
</body>
</html>
