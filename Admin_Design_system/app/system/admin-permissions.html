<body data-admin-gov="permissions">
<div class="ix-root">
  <div class="ix-layout">
    <aside class="ix-sidebar" data-ix-admin-shell="sidebar">
      <div class="ix-brand">
        <img class="ix-brand-logo" alt="iFlux" hidden />
        <span class="ix-brand-name">iFlux Admin</span>
      </div>
      <nav class="ix-menu" data-ix-admin-nav></nav>
    </aside>
    <main class="ix-main">
      <header class="ix-navbar" data-ix-admin-shell="header">
        <button class="ix-nav-btn" data-ix-toggle="sidebar" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
        <div class="ix-search"><i class="ti ti-search"></i><input type="text" placeholder="Tìm kiếm..." disabled /></div>
        <div class="ix-nav-actions"><div class="ix-avatar"></div></div>
      </header>
      <div class="ix-content">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px">

            <h1 class="ix-page-title" style="margin-bottom:4px">Phân quyền quản trị</h1>
            <div class="ix-breadcrumb" id="adm-page-bc"></div>
            <p style="color:var(--ix-text-muted);font-size:13px;margin-top:12px">Chọn vai trò nhân viên (không gồm Admin — Admin mặc định full quyền) → gán quyền theo tính năng: Xem · Tạo · Sửa · Xuất · Trạng thái.</p>
            <div id="admin-perm-session-hint" style="margin-top:10px"></div>
          </div>
          <button type="button" class="ix-btn ix-btn-primary" id="btn-save-admin-perms" data-ix-perm="access.permissions.assign_permission"><i class="ti ti-device-floppy"></i> Lưu phân quyền</button>
        </div>
        <div id="admin-perm-matrix"><p style="color:var(--ix-text-muted);font-size:13px">Đang tải ma trận…</p></div>
      </div>
    </main>
  </div>
