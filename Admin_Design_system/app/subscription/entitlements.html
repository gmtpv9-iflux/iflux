        <div class="ix-brand-logo"><svg width="18" height="18" viewBox="0 0 32 22" fill="white"><path fill-rule="evenodd" d="M0 0v6.85c0 0-.13 2.16 1.98 3.99L13.69 22l6.09-.08L18.8 9.88l-2.31-2.71L9.24 0H0z"/><path fill-rule="evenodd" d="M7.7 16.44L23.66 0H32v6.88c0 0-.17 2.29-1.34 3.52L19.78 22h-6.09L7.7 16.44z"/></svg></div>
        <span class="ix-brand-name">iFlux Admin</span>
      </div>
      <nav class="ix-menu" data-ix-admin-nav></nav>
    </aside>
    <main class="ix-main">
      <header class="ix-navbar" data-ix-admin-shell="header">
        <button class="ix-nav-btn" data-ix-toggle="sidebar" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
        <div class="ix-search"><i class="ti ti-search"></i><input type="text" placeholder="Tìm kiếm..." disabled /></div>
        <div class="ix-nav-actions"><span class="ix-chip ix-chip-warning">Local</span><div class="ix-avatar"></div></div>
      </header>
      <div class="ix-content">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px">
          <div>
            <h1 class="ix-page-title" style="margin-bottom:4px">Phân quyền sử dụng</h1>
            <div class="ix-breadcrumb"><a href="plans.html">Gói đăng ký</a><i class="ti ti-chevron-right" style="font-size:12px"></i><span>Phân quyền sử dụng</span></div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <a href="plans.html" class="ix-btn ix-btn-outline"><i class="ti ti-arrow-left"></i> Danh mục gói</a>
            <button type="button" class="ix-btn ix-btn-primary" id="btn-save-matrix"><i class="ti ti-device-floppy"></i> Lưu phân quyền</button>

        </div>
        <div id="matrix-mount"></div>
      </div>

  </div>
</div>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-routes.js?v=20260716plat1"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-nav-registry.js?v=20260716plat1"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell.js?v=20260716plat1"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-sidebar.js?v=20260716plat1"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-header.js?v=20260716plat1"></script>
<script src="../../iflux-admin-ui/iflux-admin-ui.js"></script>
<script src="../../iflux-admin-ui/widget-registry.js?v=stripTabTopN20260718"></script>
<script src="../system/platform-layers-widgets.js?v=stripTabTopN20260718"></script>
<script src="../system/widget-library-catalog.js?v=l4sot20260714b"></script>
<script src="../system/page-settings-catalog.js?v=entL4Scope20260721"></script>
<script src="../system/page-settings-store.js?v=cauChuyen20260720"></script>
<script src="../system/widget-publish-client.js?v=entPlaceList20260720"></script>
<script src="entitlement-catalog.js?v=entL4Scope20260721"></script>
<script src="plans-store.js"></script>
<script src="entitlement-matrix-ui.js?v=entL4Scope20260721"></script>
<script>
(function () {
  var mount = document.getElementById('matrix-mount');

  if (window.EntitlementCatalog && EntitlementCatalog.refreshBlocksCatalog) {
    EntitlementCatalog.refreshBlocksCatalog();
  }

  function hydratePlacementFromPublished() {
    var client = window.IfluxWidgetPublishClient;
    var cat = window.PageSettingsCatalog;
    var store = window.PageSettingsStore;
    if (!client || !client.getPage || !cat || !store || !store.hydratePublishedPage) {
      return Promise.resolve();
    }
    var keys = cat.buildModel(store.read()).map(function (page) { return page.key; });
    return Promise.all(keys.map(function (key) {
      return client.getPage(key).then(function (res) {
        if (res && res.ok && res.data) store.hydratePublishedPage(key, res.data);
      });
    }));
  }

  function bootMatrix() {
    EntitlementMatrixUI.render(mount);
    function loadMatrix() {
      if (PlansStore.hydrate) {
        PlansStore.hydrate().then(function () {
          EntitlementMatrixUI.fill(PlansStore.getMatrixPlans());
        }).catch(function () {
          EntitlementMatrixUI.fill(PlansStore.getMatrixPlans());
        });
      } else {
        EntitlementMatrixUI.fill(PlansStore.getMatrixPlans());
      }
    }
    loadMatrix();
    document.getElementById('btn-save-matrix').addEventListener('click', function () {
      var overrides = EntitlementMatrixUI.collect();
      var result = PlansStore.saveMatrixOverrides(overrides);
      if (!result.ok) {
        ixToast(result.error || 'Lưu thất bại', 'danger');
        return;
      }
      ixToast('Đã lưu ma trận phân quyền · website cập nhật khi tải lại trang (Ctrl+F5)', 'success');
      loadMatrix();
    });
  }

  hydratePlacementFromPublished().then(bootMatrix).catch(bootMatrix);
})();
</script>
</body>
</html>
