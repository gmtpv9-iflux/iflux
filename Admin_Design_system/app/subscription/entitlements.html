<script>
(function () {
  var mount = document.getElementById('matrix-mount');

  if (window.EntitlementCatalog && EntitlementCatalog.refreshBlocksCatalog) {
    EntitlementCatalog.refreshBlocksCatalog();
  }

  document.addEventListener('iflux-widget-catalog-changed', function () {
    if (window.EntitlementCatalog && EntitlementCatalog.refreshBlocksCatalog) {
      EntitlementCatalog.refreshBlocksCatalog();
    }
    if (window.EntitlementMatrixUI && EntitlementMatrixUI.render && mount) {
      EntitlementMatrixUI.render(mount);
      if (window.PlansStore && PlansStore.getMatrixPlans) {
        EntitlementMatrixUI.fill(PlansStore.getMatrixPlans());
      }
    }
  });

  function bootMatrix() {
    EntitlementMatrixUI.render(mount);
    function loadMatrix() {
      if (PlansStore.hydrate) {
        PlansStore.hydrate().then(function () {
          EntitlementMatrixUI.fill(PlansStore.getMatrixPlans());
        }).catch(function () {
          EntitlementMatrixUI.fill(PlansStore.getMatrixPlans());
        });
      } else {
        EntitlementMatrixUI.fill(PlansStore.getMatrixPlans());
      }
    }
    loadMatrix();
    document.getElementById('btn-save-matrix').addEventListener('click', function () {
      var btn = document.getElementById('btn-save-matrix');
      var overrides = EntitlementMatrixUI.collect();
      btn.disabled = true;
      PlansStore.saveMatrixOverrides(overrides).then(function (result) {
        btn.disabled = false;
        if (!result.ok) {
          ixToast(result.error || 'Lưu thất bại', 'danger');
          return;
        }
        ixToast('Đã lưu ma trận phân quyền · User Web đồng bộ qua server', 'success');
        loadMatrix();
      }).catch(function (err) {
        btn.disabled = false;
        ixToast(String(err && err.message ? err.message : err) || 'Lưu thất bại', 'danger');
      });
    });
  }

  function prefetchThenBoot() {
    var p = Promise.resolve();
    if (window.PlacementWidgetIndexReader && PlacementWidgetIndexReader.fetch) {
      p = PlacementWidgetIndexReader.fetch().catch(function () { return null; });
    }
    p.then(bootMatrix).catch(bootMatrix);
  }

  prefetchThenBoot();
})();
</script>
<script src="/Admin_Design_system/iflux-admin-ui/admin-view-gate.js?v=waveE20260727"></script>
