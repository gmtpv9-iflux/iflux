<!DOCTYPE html>
<html lang="vi">
<head>
  <script>try{var t=localStorage.getItem('iflux-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADM-COM-RSS-001 — Nguồn RSS · iFlux Admin</title>
  <link rel="preload" href="/Admin_Design_system/iflux-admin-ui/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/fonts.css" />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.css" />
  <style>
    .ix-offcanvas { transform: translateX(100%); }
  </style>
</head>
<body>
<div class="ix-root">
  <div class="ix-layout">
    <aside class="ix-sidebar" data-ix-admin-shell="sidebar">
      <div class="ix-brand">
        <div class="ix-brand-logo"><svg width="18" height="18" viewBox="0 0 32 22" fill="white"><path fill-rule="evenodd" d="M0 0v6.85c0 0-.13 2.16 1.98 3.99L13.69 22l6.09-.08L18.8 9.88l-2.31-2.71L9.24 0H0z"/><path fill-rule="evenodd" d="M7.7 16.44L23.66 0H32v6.88c0 0-.17 2.29-1.34 3.52L19.78 22h-6.09L7.7 16.44z"/></svg></div>
        <span class="ix-brand-name">iFlux Admin</span>
      </div>
      <nav class="ix-menu" data-ix-admin-nav></nav>
    </aside>
    <main class="ix-main">
      <header class="ix-navbar" data-ix-admin-shell="header">
        <button class="ix-nav-btn" data-ix-toggle="sidebar" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
        <div class="ix-search"><i class="ti ti-search"></i><input type="text" id="rss-provider-q" placeholder="Tìm nhà cung cấp..." /></div>
        <div class="ix-nav-actions"><span class="ix-chip ix-chip-warning">Môi trường local</span><div class="ix-avatar"></div></div>
      </header>
      <div class="ix-content">
        <h1 class="ix-page-title">Nguồn RSS</h1>
        <div class="ix-breadcrumb ix-mb-24">
          <a href="/Admin_Design_system/hub.html">Admin</a><i class="ti ti-chevron-right" style="font-size:12px"></i>
          <span>Cộng đồng</span><i class="ti ti-chevron-right" style="font-size:12px"></i>
          <span>Quản lý RSS</span><i class="ti ti-chevron-right" style="font-size:12px"></i>
          <span>Nguồn RSS</span>
        </div>
        <p class="ix-caption" style="margin:-8px 0 20px">Quản lý các nguồn tin mà iFlux dùng để đồng bộ dữ liệu bài viết.</p>

        <div class="ix-card">
          <div class="ix-table-toolbar">
            <div class="ix-caption">Tổng: <strong id="rss-provider-count">0</strong> nhà cung cấp</div>
            <div style="display:flex;gap:8px;margin-left:auto">
              <button type="button" class="ix-btn ix-btn-primary ix-btn-sm" id="rss-provider-add" data-ix-perm="community.rss_providers.create"><i class="ti ti-plus"></i> Thêm nguồn</button>
            </div>
          </div>
          <div class="ix-table-responsive">
            <table class="ix-table">
              <thead>
                <tr>
                  <th>Tên nhà cung cấp</th>
                  <th>Mô tả</th>
                  <th>Trạng thái</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="rss-provider-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="offcanvas-rss-provider-overlay" class="ix-offcanvas-overlay"></div>
<div id="offcanvas-rss-provider" class="ix-offcanvas">
  <div class="ix-offcanvas-header">
    <span class="ix-offcanvas-title" id="rss-provider-modal-title">Thêm nguồn RSS</span>
    <button type="button" class="ix-btn ix-btn-icon" data-ix-dismiss="offcanvas" aria-label="Đóng">
      <i class="ti ti-x" style="font-size:16px"></i>
    </button>
  </div>
  <div class="ix-offcanvas-body">
    <div class="ix-form-group">
      <label class="ix-label">ID (slug) <span style="color:var(--ix-danger)">*</span></label>
      <input type="text" class="ix-input" id="rss-f-id" maxlength="60" placeholder="vd: cafef" />
      <div class="ix-caption">Không đổi được sau khi tạo.</div>
    </div>
    <div class="ix-form-group">
      <label class="ix-label">Tên nhà cung cấp <span style="color:var(--ix-danger)">*</span></label>
      <input type="text" class="ix-input" id="rss-f-name" maxlength="200" />
    </div>
    <div class="ix-form-group">
      <label class="ix-label">Mô tả</label>
      <textarea class="ix-input" id="rss-f-desc" rows="3"></textarea>
    </div>
    <div class="ix-form-group">
      <label class="ix-label">Website</label>
      <input type="url" class="ix-input" id="rss-f-website" placeholder="https://..." />
    </div>
    <div class="ix-form-group">
      <label class="ix-label">URL index RSS</label>
      <input type="url" class="ix-input" id="rss-f-rss" placeholder="https://..." />
    </div>
    <div class="ix-form-group">
      <label class="ix-label">Trạng thái</label>
      <select class="ix-select" id="rss-f-status">
        <option value="active">Đang hoạt động</option>
        <option value="warning">Cảnh báo</option>
        <option value="empty">RSS trống</option>
        <option value="inactive">Tắt</option>
      </select>
    </div>
  </div>
  <div class="ix-offcanvas-footer">
    <button type="button" class="ix-btn ix-btn-outline" data-ix-dismiss="offcanvas">Huỷ</button>
    <button type="button" class="ix-btn ix-btn-primary" id="rss-provider-modal-save" data-ix-perm="community.rss_providers.edit">
      <i class="ti ti-check"></i> Lưu
    </button>
  </div>
</div>

<div class="ix-overlay" id="ix-overlay" style="display:none"></div>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-routes.js?v=rssProvC420260726"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-nav-registry.js?v=menuFix20260725"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell.js?v=rssProvC420260726"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-sidebar.js?v=menuFix20260725"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-header.js?v=20260716plat1"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-theme.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/admin-auth.js"></script>
<script src="/Admin_Design_system/app/community/rss-catalog.js?v=rssProvC420260726"></script>
<script src="/Admin_Design_system/app/community/rss-providers-page.js?v=rssProvC420260726"></script>
</body>
</html>
