<!DOCTYPE html>
<html lang="vi">
<head>
  <script>try{var t=localStorage.getItem('iflux-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADM-COM-RSS-002 — Đồng bộ danh mục · iFlux Admin</title>
  <link rel="preload" href="/Admin_Design_system/iflux-admin-ui/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/fonts.css" />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.css" />
</head>
<body>
<div class="ix-root">
  <div class="ix-layout">
    <aside class="ix-sidebar" data-ix-admin-shell="sidebar">
      <div class="ix-brand">
        <img class="ix-brand-logo" alt="iFlux" hidden />
        <span class="ix-brand-name">iFlux Admin</span>
      </div>
      <nav class="ix-menu" data-ix-admin-nav></nav>
    </aside>
    <main class="ix-main">
      <header class="ix-navbar" data-ix-admin-shell="header">
        <button class="ix-nav-btn" data-ix-toggle="sidebar" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
        <div class="ix-search"><i class="ti ti-search"></i><input type="text" id="rss-map-q" placeholder="Tìm danh mục / nguồn / RSS..." /></div>
        <div class="ix-nav-actions"><span class="ix-chip ix-chip-warning">Môi trường local</span><div class="ix-avatar"></div></div>
      </header>
      <div class="ix-content">
        <h1 class="ix-page-title">Đồng bộ danh mục</h1>
        <div class="ix-breadcrumb ix-mb-24" id="adm-page-bc"></div>
        <p class="ix-caption" style="margin:-8px 0 20px">Mapping Danh mục iFlux ↔ chuyên mục RSS của từng nhà cung cấp. Trạng thái dựa trên kiểm tra feed thực tế (có tin / RSS trống).</p>

        <div class="ix-card">
          <div class="ix-filter-bar">
            <div class="ix-filter-bar-title">Bộ lọc</div>
            <div class="ix-filter-row">
              <div>
                <label class="ix-label">Nhà cung cấp</label>
                <select class="ix-select" id="rss-map-provider">
                  <option value="">Tất cả</option>
                  <option value="cafef">CafeF</option>
                  <option value="vietstock">VietStock</option>
                  <option value="baodautu">Báo Đầu Tư</option>
                </select>
              </div>
              <div>
                <label class="ix-label">Trạng thái</label>
                <select class="ix-select" id="rss-map-status">
                  <option value="">Tất cả</option>
                  <option value="active">Đang hoạt động</option>
                  <option value="empty">RSS trống</option>
                  <option value="inactive">Tắt</option>
                </select>
              </div>
              <div style="display:flex;align-items:flex-end">
                <span class="ix-caption">Kết quả: <strong id="rss-map-count">0</strong></span>
              </div>
            </div>
          </div>
          <div class="ix-table-responsive">
            <table class="ix-table">
              <thead>
                <tr>
                  <th>Danh mục iFlux</th>
                  <th>Tên nhà cung cấp</th>
                  <th>Tên danh mục nguồn</th>
                  <th>RSS URL</th>
                  <th>Trạng thái mapping</th>
                </tr>
              </thead>
              <tbody id="rss-map-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="ix-overlay" id="ix-overlay" style="display:none"></div>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-routes.js?v=seoLogoOnly20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-nav-registry.js?v=seoLogoOnly20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell.js?v=rssRestore20260808"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-sidebar.js?v=seoBrandLogo36px20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-header.js?v=20260716plat1"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-theme.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/admin-auth.js"></script>
<script src="/Admin_Design_system/app/community/rss-catalog.js?v=rssRestore20260808"></script>
<script src="/Admin_Design_system/app/community/rss-category-sync-page.js?v=rssRestore20260808"></script>
</body>
</html>
