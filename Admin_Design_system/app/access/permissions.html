<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADM-ACC-002 — Permission · iFlux Admin</title>
  <link rel="preload" href="/Admin_Design_system/iflux-admin-ui/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/fonts.css" />
<link rel="stylesheet" href="../../iflux-admin-ui/iflux-admin-ui.css" />
  <script src="/Admin_Design_system/iflux-admin-ui/admin-auth.js"></script>
</head>
<body>
<div class="ix-root">
  <div class="ix-layout">
    <aside class="ix-sidebar" data-ix-admin-shell="sidebar">
      <div class="ix-brand">
        <div class="ix-brand-logo"><svg width="18" height="18" viewBox="0 0 32 22" fill="white"><path fill-rule="evenodd" d="M0 0v6.85c0 0-.13 2.16 1.98 3.99L13.69 22l6.09-.08L18.8 9.88l-2.31-2.71L9.24 0H0z"/><path fill-rule="evenodd" d="M7.7 16.44L23.66 0H32v6.88c0 0-.17 2.29-1.34 3.52L19.78 22h-6.09L7.7 16.44z"/></svg></div>
        <span class="ix-brand-name">iFlux Admin</span>
      </div>
      <nav class="ix-menu" data-ix-admin-nav></nav>
    </aside>
    <main class="ix-main">
      <header class="ix-navbar" data-ix-admin-shell="header">
        <button class="ix-nav-btn" data-ix-toggle="sidebar" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
        <div class="ix-search"><i class="ti ti-search"></i><input type="text" placeholder="Tìm kiếm (Ctrl+K)..." /></div>
        <div class="ix-nav-actions"><span class="ix-chip ix-chip-warning">Môi trường local</span><div class="ix-avatar"></div></div>
      </header>
      <div class="ix-content">
        <h1 class="ix-page-title">Quyền</h1>
        <div class="ix-breadcrumb ix-mb-24"><a href="../../hub.html">Admin</a><i class="ti ti-chevron-right" style="font-size:12px"></i><span>Vai trò &amp; Quyền</span><i class="ti ti-chevron-right" style="font-size:12px"></i><span>ADM-ACC-002</span></div>
        <p style="font-size:13px;color:var(--ix-text-muted);margin:-8px 0 20px">Danh mục quyền chi tiết — gom vào vai trò rồi gán cho khách hàng theo gói.</p>

        <div class="ix-card">
          <div class="ix-filter-bar">
            <div class="ix-filter-bar-title">Bộ lọc</div>
            <div class="ix-filter-row">
              <div><label class="ix-label">Nhóm</label><select class="ix-select" id="filter-perm-group"><option value="">Tất cả</option></select></div>
              <div><label class="ix-label">Package tối thiểu</label><select class="ix-select" id="filter-perm-package"><option value="">Tất cả</option><option value="free">Miễn phí</option><option value="premium">Premium</option><option value="elite">Elite</option></select></div>
            </div>
          </div>
          <div class="ix-table-toolbar">
            <div class="ix-table-search"><i class="ti ti-search"></i><input type="text" id="perms-search" placeholder="Tìm permission..." /></div>
            <div class="ix-table-actions">
              <button type="button" class="ix-btn ix-btn-primary ix-btn-sm" id="btn-add-perm"><i class="ti ti-plus" style="font-size:13px"></i> Thêm quyền</button>
            </div>
          </div>
          <div class="ix-table-responsive">
            <table class="ix-table">
              <thead><tr>
                <th>Quyền</th><th>Mã</th><th>Nhóm</th><th>Gói tối thiểu</th><th>Mô tả</th><th>Thao tác</th>
              </tr></thead>
              <tbody id="perms-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="ix-overlay" id="ix-overlay" style="display:none"></div>

<div id="perm-modal" class="ix-modal-overlay" style="display:none" data-edit-key="new">
  <div class="ix-modal" style="width:560px">
    <div class="ix-modal-header">
      <span class="ix-modal-title" id="perm-modal-title">Thêm quyền</span>
      <button type="button" class="ix-btn ix-btn-icon" data-ix-dismiss="modal"><i class="ti ti-x" style="font-size:16px"></i></button>
    </div>
    <div class="ix-modal-body">
      <div class="ix-form-group"><label class="ix-label">Tên <span style="color:var(--ix-danger)">*</span></label><input type="text" class="ix-input" id="perm-field-name" placeholder="VD: Tổng quan thị trường" /></div>
      <div class="ix-form-group"><label class="ix-label">Mã <span style="color:var(--ix-danger)">*</span></label><input type="text" class="ix-input" id="perm-field-code" placeholder="VD: market.overview" /></div>
      <div class="ix-form-group"><label class="ix-label">Nhóm <span style="color:var(--ix-danger)">*</span></label><input type="text" class="ix-input" id="perm-field-group" placeholder="VD: Thị trường" list="perm-group-suggestions" /></div>
      <datalist id="perm-group-suggestions"></datalist>
      <div class="ix-form-group"><label class="ix-label">Package tối thiểu</label><select class="ix-select" id="perm-field-package"><option value="free">Miễn phí</option><option value="premium">Premium</option><option value="elite">Elite</option></select></div>
      <div class="ix-form-group"><label class="ix-label">Mô tả</label><textarea class="ix-input" id="perm-field-desc" rows="2" placeholder="Mô tả ngắn"></textarea></div>
    </div>
    <div class="ix-modal-footer">
      <button type="button" class="ix-btn ix-btn-outline" data-ix-dismiss="modal">Huỷ</button>
      <button type="button" class="ix-btn ix-btn-primary" id="btn-save-perm"><i class="ti ti-check"></i> Lưu</button>
    </div>
  </div>
</div>

<script src="access-store.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-routes.js?v=20260716plat1"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-nav-registry.js?v=20260716plat1"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell.js?v=20260716plat1"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-sidebar.js?v=20260716plat1"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-header.js?v=20260716plat1"></script>
<script src="../../iflux-admin-ui/iflux-admin-ui.js"></script>
<script>
(function () {
  var groupSelect = document.getElementById('filter-perm-group');
  var groupDatalist = document.getElementById('perm-group-suggestions');
  AccessStore.getPermissionGroups().forEach(function (g) {
    var optFilter = document.createElement('option');
    optFilter.value = g;
    groupSelect.appendChild(optFilter);
    var optList = document.createElement('option');
    optList.value = g;
    groupDatalist.appendChild(optList);
  });

  AccessStore.refreshPermissionsPage();

  groupSelect.addEventListener('change', function () {
    AccessStore.refreshPermissionsPage();
  });
  document.getElementById('filter-perm-package').addEventListener('change', function () {
    AccessStore.refreshPermissionsPage();
  });
  document.getElementById('perms-search').addEventListener('input', function () {
    AccessStore.refreshPermissionsPage();
  });

  function openPermModal(key) {
    var perm = AccessStore.getPermission(key);
    if (!perm) {
      ixToast('Không tìm thấy quyền', 'danger');
      return;
    }
    AccessStore.fillPermModal(perm);
    ixOpenModal('perm-modal');
  }

  document.getElementById('btn-add-perm').addEventListener('click', function () {
    openPermModal('new');
  });

  document.getElementById('btn-save-perm').addEventListener('click', function () {
    var modal = document.getElementById('perm-modal');
    var editKey = modal.dataset.editKey || 'new';
    var result = AccessStore.savePermission(editKey, AccessStore.collectPermForm());
    if (!result.ok) {
      ixToast(result.error, 'danger');
      return;
    }
    ixCloseModal('perm-modal');
    var groups = AccessStore.getPermissionGroups();
    while (groupSelect.options.length > 1) groupSelect.remove(1);
    groupDatalist.innerHTML = '';
    groups.forEach(function (g) {
      var optFilter = document.createElement('option');
      optFilter.value = g;
      groupSelect.appendChild(optFilter);
      var optList = document.createElement('option');
      optList.value = g;
      groupDatalist.appendChild(optList);
    });
    AccessStore.refreshPermissionsPage();
    ixToast('Đã lưu quyền', 'success');
  });

  document.addEventListener('click', function (e) {
    var editBtn = e.target.closest('[data-edit-perm]');
    if (editBtn) {
      e.preventDefault();
      openPermModal(editBtn.getAttribute('data-edit-perm'));
      return;
    }
    var delBtn = e.target.closest('[data-delete-perm]');
    if (!delBtn) return;
    e.preventDefault();
    var permId = delBtn.getAttribute('data-delete-perm');
    if (!confirm('Xoá permission "' + permId + '"?')) return;
    var result = AccessStore.deletePermission(permId);
    if (!result.ok) {
      ixToast(result.error, 'danger');
      return;
    }
    AccessStore.refreshPermissionsPage();
    ixToast('Đã xoá quyền', 'success');
  });
})();
</script>
</body>
</html>
