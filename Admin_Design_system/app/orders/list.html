<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Danh sách đơn hàng · iFlux Admin</title>
  <link rel="preload" href="/Admin_Design_system/iflux-admin-ui/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/fonts.css" />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.css?v=sub02p2c-20260831" />
  <script src="/Admin_Design_system/iflux-admin-ui/admin-auth.js"></script>
</head>
<body data-orders-page="list">
<div class="ix-root">
  <div class="ix-layout">
    <aside class="ix-sidebar" data-ix-admin-shell="sidebar">
      <div class="ix-brand">
        <img class="ix-brand-logo" alt="iFlux" hidden />
        <span class="ix-brand-name">iFlux Admin</span>
      </div>
      <nav class="ix-menu" data-ix-admin-nav></nav>
    </aside>
    <main class="ix-main">
      <header class="ix-navbar" data-ix-admin-shell="header">
        <button class="ix-nav-btn" data-ix-toggle="sidebar" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
        <div class="ix-search"><i class="ti ti-search"></i><input type="text" placeholder="Tìm kiếm..." disabled /></div>
        <div class="ix-nav-actions"><div class="ix-avatar"></div></div>
      </header>
      <div class="ix-content">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px">
          <div>
            <h1 class="ix-page-title">Danh sách đơn hàng</h1>
            <div class="ix-breadcrumb ix-mb-16" id="adm-page-bc"></div>
            <p style="color:var(--ix-text-muted);font-size:13px;margin:0">Xem / sửa / xoá / cập nhật trạng thái. Duyệt chuyển khoản để kích hoạt gói.</p>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start">
            <button type="button" class="ix-btn ix-btn-outline" id="adm-txn-export" data-ix-perm="subscription.transactions.export"><i class="ti ti-download"></i> Xuất CSV</button>
            <a href="/admin/orders/add" class="ix-btn ix-btn-primary" data-ix-perm="subscription.transactions.create"><i class="ti ti-plus"></i> Thêm mới đơn hàng</a>
          </div>
        </div>

        <div class="ix-grid ix-grid-4 ix-mb-24">
          <div class="ix-card ix-card-body">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <div><div id="adm-txn-stat-total" style="font-size:18px;font-weight:700;color:var(--ix-text-primary)">—</div><div style="font-size:12px;color:var(--ix-text-muted)">Tổng đơn</div></div>
              <div class="ix-stat-icon accent" style="border-radius:50%;width:40px;height:40px;font-size:18px"><i class="ti ti-receipt"></i></div>
            </div>
          </div>
          <div class="ix-card ix-card-body">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <div><div id="adm-txn-stat-pending" style="font-size:18px;font-weight:700;color:var(--ix-warning)">—</div><div style="font-size:12px;color:var(--ix-text-muted)">CK chờ duyệt</div></div>
              <div class="ix-stat-icon warning" style="border-radius:50%;width:40px;height:40px;font-size:18px"><i class="ti ti-clock-hour-4"></i></div>
            </div>
          </div>
          <div class="ix-card ix-card-body">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <div><div id="adm-txn-stat-approved" style="font-size:18px;font-weight:700;color:var(--ix-success)">—</div><div style="font-size:12px;color:var(--ix-text-muted)">Đã duyệt / TT</div></div>
              <div class="ix-stat-icon success" style="border-radius:50%;width:40px;height:40px;font-size:18px"><i class="ti ti-check"></i></div>
            </div>
          </div>
          <div class="ix-card ix-card-body">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <div><div id="adm-txn-stat-revenue" style="font-size:18px;font-weight:700;color:var(--ix-text-primary)">—</div><div style="font-size:12px;color:var(--ix-text-muted)">Doanh thu ghi nhận</div></div>
              <div class="ix-stat-icon info" style="border-radius:50%;width:40px;height:40px;font-size:18px"><i class="ti ti-currency-dong"></i></div>
            </div>
          </div>
        </div>

        <div class="ix-card">
          <div class="ix-filter-bar">
            <div class="ix-filter-bar-title">Bộ lọc</div>
            <div class="ix-filter-row">
              <div><label class="ix-label">Trạng thái</label><select class="ix-select" id="adm-txn-filter-status"><option value="">Tất cả</option><option value="pending">Chờ duyệt</option><option value="approved">Đã duyệt</option><option value="paid">Đã thanh toán</option><option value="rejected">Từ chối</option><option value="refunded">Đã hoàn tiền</option></select></div>
              <div><label class="ix-label">Hình thức</label><select class="ix-select" id="adm-txn-filter-method"><option value="">Tất cả</option><option value="transfer">Chuyển khoản</option><option value="card">Thẻ</option><option value="momo">MoMo</option><option value="vnpay">VNPay</option></select></div>
            </div>
          </div>
          <div class="ix-table-toolbar">
            <div class="ix-table-search"><i class="ti ti-search"></i><input type="text" id="adm-txn-search" placeholder="Tìm mã đơn, email, nội dung CK..." /></div>
          </div>
          <div class="ix-table-responsive">
            <table class="ix-table" id="adm-txn-table">
              <thead><tr>
                <th>Mã đơn</th><th>Khách hàng</th><th>Gói</th><th>Số tiền</th><th>Thanh toán</th><th>Nội dung CK</th><th>Trạng thái</th><th>Thời gian</th><th>Thao tác</th>
              </tr></thead>
              <tbody id="adm-txn-tbody"><tr><td colspan="9" style="text-align:center;padding:32px;color:var(--ix-text-muted)">Đang tải…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-routes.js?v=seoLogoOnly20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-nav-registry.js?v=seoLogoOnly20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell.js?v=sub02p2c-20260831"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-sidebar.js?v=sub02p2c-20260831"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-header.js?v=sub02p2c-20260831"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.js"></script>
<script src="/Admin_Design_system/app/orders/orders-page.js?v=noep1txn20260726"></script>
</body>
</html>
