<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sửa đơn hàng · iFlux Admin</title>
  <link rel="preload" href="/Admin_Design_system/iflux-admin-ui/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/fonts.css" />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.css" />
  <script src="/Admin_Design_system/iflux-admin-ui/admin-auth.js"></script>
</head>
<body data-orders-page="edit">
<div class="ix-root">
  <div class="ix-layout">
    <aside class="ix-sidebar" data-ix-admin-shell="sidebar">
      <div class="ix-brand">
        <img class="ix-brand-logo" alt="iFlux" hidden />
        <span class="ix-brand-name">iFlux Admin</span>
      </div>
      <nav class="ix-menu" data-ix-admin-nav></nav>
    </aside>
    <main class="ix-main">
      <header class="ix-navbar" data-ix-admin-shell="header">
        <button class="ix-nav-btn" data-ix-toggle="sidebar" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
        <div class="ix-search"><i class="ti ti-search"></i><input type="text" placeholder="Tìm kiếm..." disabled /></div>
        <div class="ix-nav-actions"><div class="ix-avatar"></div></div>
      </header>
      <div class="ix-content">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px">
          <div>
            <h1 class="ix-page-title">Xem / Sửa đơn hàng</h1>
            <div class="ix-breadcrumb" id="adm-page-bc"></div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <a href="/admin/orders/list" class="ix-btn ix-btn-outline">Quay lại</a>
            <button type="button" class="ix-btn ix-btn-outline" id="btn-delete-order" data-ix-perm="subscription.transactions.cancel"><i class="ti ti-trash"></i> Xoá</button>
            <button type="button" class="ix-btn ix-btn-primary" id="btn-save-order" data-ix-perm="subscription.transactions.edit"><i class="ti ti-device-floppy"></i> Lưu</button>
          </div>
        </div>

        <div class="ix-card" style="padding:20px;max-width:720px">
          <div class="ix-form-group">
            <label class="ix-label">Email khách hàng</label>
            <input type="email" class="ix-input" id="ord-email" />
          </div>
          <div class="ix-form-group">
            <label class="ix-label">Tên hiển thị</label>
            <input type="text" class="ix-input" id="ord-user-name" />
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
            <div class="ix-form-group">
              <label class="ix-label">Gói</label>
              <select class="ix-select" id="ord-plan-tier">
                <option value="premium">Premium</option>
                <option value="elite">Elite</option>
                <option value="free">Miễn phí</option>
              </select>
            </div>
            <div class="ix-form-group">
              <label class="ix-label">Chu kỳ</label>
              <select class="ix-select" id="ord-cycle">
                <option value="monthly">Hàng tháng</option>
                <option value="annual">Hàng năm</option>
                <option value="lifetime">Trọn đời</option>
              </select>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
            <div class="ix-form-group">
              <label class="ix-label">Số tiền (VND)</label>
              <input type="number" class="ix-input" id="ord-amount" min="0" step="1000" />
            </div>
            <div class="ix-form-group">
              <label class="ix-label">Hình thức thanh toán</label>
              <select class="ix-select" id="ord-pay-method">
                <option value="transfer">Chuyển khoản</option>
                <option value="card">Thẻ</option>
                <option value="momo">MoMo</option>
                <option value="vnpay">VNPay</option>
              </select>
            </div>
          </div>
          <div class="ix-form-group">
            <label class="ix-label">Nội dung / mã tham chiếu</label>
            <input type="text" class="ix-input" id="ord-transfer-ref" />
          </div>
          <div class="ix-form-group">
            <label class="ix-label">Trạng thái</label>
            <select class="ix-select" id="ord-status">
              <option value="pending">Chờ duyệt</option>
              <option value="approved">Đã duyệt</option>
              <option value="paid">Đã thanh toán</option>
              <option value="rejected">Từ chối</option>
              <option value="refunded">Đã hoàn tiền</option>
            </select>
            <div class="ix-field-hint">Chọn Đã duyệt / Đã thanh toán sẽ kích hoạt gói cho khách.</div>
          </div>
          <div class="ix-form-group ix-mb-0">
            <label class="ix-label">Ghi chú / lý do</label>
            <textarea class="ix-textarea" id="ord-note" style="min-height:80px"></textarea>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-routes.js?v=seoLogoOnly20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-nav-registry.js?v=seoLogoOnly20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell.js?v=sub02p2-20260831"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-sidebar.js?v=sub02p2-20260831"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-header.js?v=sub02p2-20260831"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.js"></script>
<script src="/Admin_Design_system/app/orders/orders-page.js?v=noep1txn20260726"></script>
</body>
</html>
