<!DOCTYPE html>
<html lang="vi">
<head>
  <script>try{var t=localStorage.getItem('iflux-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADM-DATA-002 — Tác vụ ETL · iFlux Admin</title>
  <link rel="preload" href="/Admin_Design_system/iflux-admin-ui/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/fonts.css" />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.css" />
  <style>
    .ix-modal-overlay { display: none; }
  </style>
</head>
<body>
<div class="ix-root">
  <div class="ix-layout">
    <aside class="ix-sidebar" data-ix-admin-shell="sidebar">
      <div class="ix-brand">
        <img class="ix-brand-logo" alt="iFlux" hidden />
        <span class="ix-brand-name">iFlux Admin</span>
      </div>
      <nav class="ix-menu" data-ix-admin-nav></nav>
    </aside>
    <main class="ix-main">
      <header class="ix-navbar" data-ix-admin-shell="header">
        <button class="ix-nav-btn" data-ix-toggle="sidebar" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
        <div class="ix-search"><i class="ti ti-search"></i><input type="text" id="adm-etl-search" placeholder="Tìm tác vụ..." /></div>
        <div class="ix-nav-actions"><div class="ix-avatar"></div></div>
      </header>
      <div class="ix-content">
        <h1 class="ix-page-title">Tác vụ ETL</h1>
        <div class="ix-breadcrumb ix-mb-24" id="adm-page-bc"></div>
        <p class="ix-caption" style="margin:-8px 0 20px">Quản lý lịch chạy và kích hoạt tác vụ ETL.</p>
        <div class="ix-card">
          <div class="ix-table-toolbar">
            <div class="ix-caption">Tổng: <strong id="adm-etl-count">0</strong> tác vụ</div>
            <div style="display:flex;gap:8px;margin-left:auto">
              <button type="button" class="ix-btn ix-btn-primary ix-btn-sm" id="btn-adm-etl-add" data-ix-perm="data.etl_jobs.create">
                <i class="ti ti-plus"></i> Thêm tác vụ
              </button>
            </div>
          </div>
          <div class="ix-table-responsive">
            <table class="ix-table">
              <thead>
                <tr>
                  <th>Tác vụ</th>
                  <th>Lịch</th>
                  <th>Lần chạy cuối</th>
                  <th>Trạng thái</th>
                  <th>Thời lượng</th>
                  <th>Bản ghi</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="adm-etl-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="ix-modal-overlay" id="modal-etl-form">
  <div class="ix-modal-box" style="max-width:480px">
    <button type="button" class="ix-modal-close" data-ix-dismiss="modal"><i class="ti ti-x"></i></button>
    <div class="ix-modal-title" id="adm-etl-modal-title">Thêm tác vụ ETL</div>
    <div class="ix-form-group" style="margin-top:16px">
      <label class="ix-label">Mã (code)</label>
      <input type="text" class="ix-input" id="adm-etl-code" maxlength="80" placeholder="vd: ingest_ticks_hose" />
    </div>
    <div class="ix-form-group">
      <label class="ix-label">Tên tác vụ</label>
      <input type="text" class="ix-input" id="adm-etl-name" maxlength="200" />
    </div>
    <div class="ix-form-group">
      <label class="ix-label">Lịch (cron)</label>
      <input type="text" class="ix-input" id="adm-etl-schedule" maxlength="80" placeholder="*/5 * * * *" />
    </div>
    <div class="ix-form-group">
      <label class="ix-label">Mô tả</label>
      <textarea class="ix-input" id="adm-etl-desc" rows="2"></textarea>
    </div>
    <div style="margin-top:20px;display:flex;gap:8px;justify-content:flex-end">
      <button type="button" class="ix-btn ix-btn-outline" data-ix-dismiss="modal">Huỷ</button>
      <button type="button" class="ix-btn ix-btn-primary" id="btn-adm-etl-save" data-ix-perm="data.etl_jobs.edit">Lưu</button>
    </div>
  </div>
</div>

<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-routes.js?v=seoLogoOnly20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-nav-registry.js?v=seoLogoOnly20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell.js?v=etlC720260727"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-sidebar.js?v=seoBrandLogo36px20260810"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-app-shell-header.js?v=20260716plat1"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-admin-ui.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/admin-auth.js"></script>
<script src="/Admin_Design_system/iflux-admin-ui/iflux-theme.js"></script>
<script src="/Admin_Design_system/app/data/etl-jobs-page.js?v=etlC720260727"></script>
<script>AdmEtlJobs.init();</script>
</body>
</html>
