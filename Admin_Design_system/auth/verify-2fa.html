<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADM-AUTH — Xác thực 2FA · iFlux Admin</title>
  <link rel="preload" href="/Admin_Design_system/iflux-admin-ui/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/Admin_Design_system/iflux-admin-ui/fonts.css" />
<link rel="stylesheet" href="../iflux-admin-ui/iflux-admin-ui.css" />
</head>
<body>
<div class="ix-auth-root">
  <div class="ix-auth-card">
    <div class="ix-auth-brand">
      <span class="ix-auth-brand-name">iFlux</span>
    </div>

    <div class="ix-auth-title">Xác thực 2FA</div>
    <div class="ix-auth-sub">Nhập mã 6 số từ ứng dụng Authenticator (TOTP) — BR-ADM-02</div>

    <div class="ix-form-group">
      <label class="ix-label">Mã xác thực</label>
      <input type="text" class="ix-input" id="otp-code" inputmode="numeric" maxlength="6" placeholder="000000" autofocus style="text-align:center;font-family:var(--ifx-font-mono);letter-spacing:0.25em;font-size:20px" />
      <p style="font-size:12px;color:var(--ix-text-muted);margin:8px 0 0">Mã làm mới mỗi 30 giây. Không chia sẻ mã với bất kỳ ai.</p>
    </div>

    <a href="../app/dashboard/index.html" class="ix-btn ix-btn-primary" id="otp-submit" style="width:100%;margin-bottom:16px;text-align:center">Xác nhận</a>

    <div class="ix-auth-footer">
      <a href="login.html">Quay lại đăng nhập</a>
    </div>

    <a href="../hub.html" class="ix-auth-back" style="margin-top:20px">
      <i class="ti ti-chevron-left" style="font-size:13px"></i>
      Về Hub checklist
    </a>
  </div>
</div>
<script src="../iflux-admin-ui/iflux-admin-ui.js"></script>
<script>
document.getElementById('otp-submit').addEventListener('click', function (e) {
  var code = (document.getElementById('otp-code').value || '').trim();
  if (code.length !== 6) {
    e.preventDefault();
    if (typeof ixToast === 'function') ixToast('Nhập đủ 6 số TOTP', 'warning');
    return;
  }
  if (typeof ixToast === 'function') ixToast('2FA xác thực thành công', 'success');
});
</script>
</body>
</html>
