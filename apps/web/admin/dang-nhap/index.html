<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập Admin · iFlux</title>
  <link rel="preload" href="/assets/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/assets/ds.css?v=20260816a" />
  <link rel="stylesheet" href="/admin/dang-nhap/auth.css?v=20260815g" />
</head>
<body>
  <div class="ifx-auth">
    <div class="ifx-card">
      <div class="ifx-card__body">
        <div class="ifx-auth__brand">iFlux Admin</div>
        <h1 class="ifx-auth__title">Đăng nhập quản trị</h1>
        <p class="ifx-auth__lead">Chỉ tài khoản được cấp quyền mới truy cập được khu vực Admin.</p>

        <div class="ifx-alert ifx-alert--danger" id="login-error" role="alert" hidden></div>

        <div class="ifx-segmented" id="login-tabs">
          <button type="button" class="ifx-segment is-active" id="login-tab-gmail">Bằng Gmail</button>
          <button type="button" class="ifx-segment" id="login-tab-password">Bằng mật khẩu</button>
        </div>

        <div id="login-panel-gmail">
          <div id="login-google-host"></div>
          <button type="button" class="ifx-button ifx-button--outline ifx-button--block" id="login-google-fallback" hidden>
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M21.6 12.23c0-.74-.07-1.45-.19-2.13H12v4.03h5.38a4.6 4.6 0 0 1-2 3.02v2.5h3.24c1.9-1.75 2.98-4.33 2.98-7.42z"/>
              <path d="M12 22c2.7 0 4.97-.9 6.63-2.35l-3.24-2.5c-.9.6-2.05.96-3.39.96-2.61 0-4.82-1.76-5.61-4.13H3.05v2.58A10 10 0 0 0 12 22z"/>
              <path d="M6.39 13.98A6.01 6.01 0 0 1 6.08 12c0-.69.12-1.35.31-1.98V7.44H3.05A10 10 0 0 0 2 12c0 1.61.39 3.14 1.05 4.56l3.34-2.58z"/>
              <path d="M12 5.96c1.47 0 2.79.5 3.82 1.5l2.87-2.87C16.96 2.97 14.7 2 12 2A10 10 0 0 0 3.05 7.44l3.34 2.58C7.18 7.72 9.39 5.96 12 5.96z"/>
            </svg>
            Đăng nhập bằng Gmail
          </button>
          <div class="ifx-alert ifx-alert--warning" id="login-google-unavailable" role="alert" hidden>
            Trình duyệt/địa chỉ này không mở được đăng nhập Google. Hãy chuyển sang tab “Bằng mật khẩu”.
          </div>
        </div>

        <div id="login-panel-password" hidden>
          <form id="login-form" autocomplete="on">
            <div class="ifx-field">
              <label class="ifx-field__label" for="login-email">Email</label>
              <input
                class="ifx-input"
                id="login-email"
                name="email"
                type="email"
                autocomplete="username"
                placeholder="admin@iflux.vn"
                required
              />
            </div>

            <div class="ifx-field">
              <label class="ifx-field__label" for="login-password">Mật khẩu</label>
              <input
                class="ifx-input"
                id="login-password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="••••••••"
                required
              />
            </div>

            <button type="submit" class="ifx-button ifx-button--primary ifx-button--block" id="login-submit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                <polyline points="10 17 15 12 10 7"/>
                <line x1="15" y1="12" x2="3" y2="12"/>
              </svg>
              Đăng nhập
            </button>
          </form>
        </div>

        <div class="ifx-auth__remember">
          <label class="ifx-check">
            <input type="checkbox" class="ifx-checkbox" id="login-remember" checked />
            Ghi nhớ đăng nhập trên máy này
          </label>
        </div>

        <p class="ifx-auth__hint">Phiên ghi nhớ giữ đăng nhập để lần sau không cần xác thực lại trên trình duyệt này.</p>
      </div>
    </div>
  </div>
  <script src="/admin/platform.js"></script>
  <script src="/admin/session.js"></script>
  <script src="/admin/api.js"></script>
  <script src="/admin/auth-api.js"></script>
  <script src="/admin/dang-nhap/login.js?v=20260816a"></script>
</body>
</html>
