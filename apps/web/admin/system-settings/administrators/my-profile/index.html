<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hồ sơ của tôi · iFlux</title>
  <link rel="preload" href="/assets/design-system/foundation/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/assets/design-system/index.css?v=20260817d" />
  <link rel="stylesheet" href="/admin/system-settings/administrators/administrators.css?v=20260817c" />
</head>
<body>
  <div class="ifx-shell" id="ifx-shell">
    <main class="ifx-shell__content">
      <div class="ifx-page">
        <div class="ifx-page__head">
          <p class="ifx-admins-crumb">Admin / Hệ thống / Quản trị viên / Hồ sơ của tôi</p>
          <h1 class="ifx-page__title">Hồ sơ của tôi</h1>
          <p class="ifx-page__meta">Vai trò và cấp truy cập do hệ thống gán — chỉ xem.</p>
        </div>
        <div class="ifx-admins-profile">
          <section class="ifx-card">
            <div class="ifx-card__body">
              <h2 class="ifx-admins-role__name">Thông tin định danh</h2>
              <label class="ifx-field">
                <span class="ifx-field__label">Họ tên</span>
                <input class="ifx-input" id="profile-name" type="text" />
              </label>
              <label class="ifx-field">
                <span class="ifx-field__label">Email</span>
                <input class="ifx-input" id="profile-email" type="email" readonly />
                <span class="ifx-admins-hint">Email đăng nhập — không đổi tại đây.</span>
              </label>
              <label class="ifx-field">
                <span class="ifx-field__label">Mã tài khoản</span>
                <p class="ifx-admins-readonly" id="profile-id">—</p>
              </label>
              <button class="ifx-button ifx-button--primary" id="profile-save" type="button">Lưu hồ sơ</button>
            </div>
          </section>
          <section class="ifx-card">
            <div class="ifx-card__body">
              <h2 class="ifx-admins-role__name">Thông tin truy cập</h2>
              <label class="ifx-field">
                <span class="ifx-field__label">Cấp truy cập</span>
                <div id="profile-access"></div>
              </label>
              <label class="ifx-field">
                <span class="ifx-field__label">Vai trò được gán</span>
                <div id="profile-roles"></div>
              </label>
              <label class="ifx-field">
                <span class="ifx-field__label">Mật khẩu hiện tại</span>
                <input class="ifx-input" id="profile-current" type="password" autocomplete="current-password" />
              </label>
              <label class="ifx-field">
                <span class="ifx-field__label">Mật khẩu mới</span>
                <input class="ifx-input" id="profile-password" type="password" minlength="8" autocomplete="new-password" />
              </label>
              <label class="ifx-field">
                <span class="ifx-field__label">Xác nhận mật khẩu mới</span>
                <input class="ifx-input" id="profile-confirm" type="password" minlength="8" autocomplete="new-password" />
              </label>
              <button class="ifx-button ifx-button--outline" id="profile-password-save" type="button">Đổi mật khẩu</button>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>
  <div class="ifx-admins-toast" id="admins-toast" hidden></div>

  <script src="/admin/platform.js"></script>
  <script src="/admin/session.js"></script>
  <script src="/admin/api.js?v=20260815i"></script>
  <script src="/admin/auth-api.js"></script>
  <script src="/admin/navigation.js?v=20260817a"></script>
  <script src="/admin/shell.js?v=20260817c"></script>
  <script src="/admin/protect.js"></script>
  <script src="/admin/system-settings/administrators/my-profile/profile.js?v=20260817a"></script>
</body>
</html>
