<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vai trò quản trị · iFlux</title>
  <link rel="preload" href="/assets/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/assets/ds.css?v=20260816a" />
  <link rel="stylesheet" href="/admin/system-settings/administrators/administrators.css?v=20260817a" />
</head>
<body>
  <div class="ifx-shell" id="ifx-shell">
    <main class="ifx-shell__content">
      <div class="ifx-page">
        <div class="ifx-page__head">
          <p class="ifx-admins-crumb">Admin / Hệ thống / Quản trị viên / Vai trò quản trị</p>
          <h1 class="ifx-page__title">Vai trò quản trị</h1>
          <p class="ifx-page__meta">Chỉ quản lý hồ sơ vai trò (tên, mã, mô tả). Phân quyền thao tác chỉ tại “Phân quyền quản trị”. Vai trò Owner luôn toàn quyền — không chỉnh, không nằm Matrix.</p>
        </div>
        <div class="ifx-admins-grid" id="roles-grid">
          <p class="ifx-admins-hint">Đang tải…</p>
        </div>
      </div>
    </main>
  </div>

  <div class="ifx-offcanvas" id="roles-drawer" hidden>
    <div class="ifx-offcanvas__backdrop" data-close="1"></div>
    <div class="ifx-offcanvas__panel" role="dialog" aria-labelledby="roles-drawer-title">
      <div class="ifx-offcanvas__head">
        <h2 class="ifx-offcanvas__title" id="roles-drawer-title">Thêm vai trò</h2>
        <button class="ifx-button ifx-button--outline" type="button" data-close="1">Đóng</button>
      </div>
      <div class="ifx-offcanvas__body">
        <input type="hidden" id="role-id" />
        <label class="ifx-field">
          <span class="ifx-field__label">Tên</span>
          <input class="ifx-input" id="role-name" type="text" required />
        </label>
        <label class="ifx-field">
          <span class="ifx-field__label">Mã</span>
          <input class="ifx-input" id="role-code" type="text" required />
          <span class="ifx-admins-hint">Viết thường, không dấu, dùng gạch dưới.</span>
        </label>
        <label class="ifx-field">
          <span class="ifx-field__label">Mô tả</span>
          <textarea class="ifx-input" id="role-description" rows="4"></textarea>
        </label>
      </div>
      <div class="ifx-offcanvas__foot">
        <button class="ifx-button ifx-button--outline" type="button" data-close="1">Huỷ</button>
        <button class="ifx-button ifx-button--primary" id="role-save" type="button">Lưu</button>
      </div>
    </div>
  </div>
  <div class="ifx-admins-toast" id="admins-toast" hidden></div>

  <script src="/admin/platform.js"></script>
  <script src="/admin/session.js"></script>
  <script src="/admin/api.js?v=20260815i"></script>
  <script src="/admin/auth-api.js"></script>
  <script src="/admin/navigation.js?v=20260817a"></script>
  <script src="/admin/shell.js?v=20260817a"></script>
  <script src="/admin/protect.js"></script>
  <script src="/admin/system-settings/administrators/roles/roles.js?v=20260817a"></script>
</body>
</html>
