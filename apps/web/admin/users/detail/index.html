<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chi tiết người dùng · iFlux</title>
  <link rel="preload" href="/assets/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/assets/ds.css?v=20260816a" />
  <link rel="stylesheet" href="/admin/users/users.css?v=20260817a" />
</head>
<body>
  <div class="ifx-shell" id="ifx-shell">
    <main class="ifx-shell__content">
      <div class="ifx-page">
        <div class="ifx-page__head">
          <h1 class="ifx-page__title" id="detail-title">Chi tiết người dùng</h1>
          <p class="ifx-page__meta" id="detail-meta">Đang tải…</p>
        </div>

        <div class="ifx-alert ifx-alert--danger" id="detail-error" hidden></div>

        <section class="ifx-card" id="detail-card" hidden>
          <div class="ifx-card__body">
            <div class="ifx-users-detail">
              <div class="ifx-field">
                <label class="ifx-field__label" for="detail-name">Tên hiển thị</label>
                <input class="ifx-input" id="detail-name" type="text" maxlength="255" />
              </div>

              <div class="ifx-field">
                <label class="ifx-field__label" for="detail-phone">Điện thoại</label>
                <input class="ifx-input" id="detail-phone" type="tel" autocomplete="off" />
              </div>

              <div class="ifx-field">
                <label class="ifx-field__label" for="detail-status">Trạng thái tài khoản</label>
                <select class="ifx-select" id="detail-status">
                  <option value="active">Hoạt động</option>
                  <option value="suspended">Tạm khóa</option>
                </select>
              </div>

              <div class="ifx-field">
                <span class="ifx-field__label">Email</span>
                <p class="ifx-users-readonly" id="detail-email"></p>
              </div>

              <div class="ifx-field">
                <span class="ifx-field__label">Xác thực email</span>
                <p class="ifx-users-readonly" id="detail-verified"></p>
              </div>

              <div class="ifx-field">
                <span class="ifx-field__label">Đăng nhập bằng</span>
                <p class="ifx-users-readonly" id="detail-provider"></p>
              </div>

              <div class="ifx-field">
                <span class="ifx-field__label">Ngày tạo</span>
                <p class="ifx-users-readonly" id="detail-created"></p>
              </div>

              <div class="ifx-field">
                <span class="ifx-field__label">Cập nhật gần nhất</span>
                <p class="ifx-users-readonly" id="detail-updated"></p>
              </div>

              <div class="ifx-field ifx-users-detail__full">
                <span class="ifx-field__label">Giới thiệu</span>
                <p class="ifx-users-readonly" id="detail-bio"></p>
              </div>
            </div>
          </div>

          <div class="ifx-card__foot ifx-users-actions">
            <button class="ifx-button ifx-button--primary" id="detail-save" type="button">Lưu thay đổi</button>
            <a class="ifx-button ifx-button--outline" href="/admin/users">Quay lại danh sách</a>
            <span id="detail-note"></span>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="/admin/platform.js"></script>
  <script src="/admin/session.js"></script>
  <script src="/admin/api.js?v=20260815i"></script>
  <script src="/admin/auth-api.js"></script>
  <script src="/admin/navigation.js?v=20260815i"></script>
  <script src="/admin/shell.js"></script>
  <script src="/admin/protect.js"></script>
  <script src="/admin/users/detail/detail.js?v=20260817a"></script>
</body>
</html>
