<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quản lý người dùng · iFlux</title>
  <link rel="preload" href="/assets/design-system/foundation/fonts/BeVietnamPro-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/assets/design-system/index.css?v=20260817d" />
  <link rel="stylesheet" href="/admin/users/users.css?v=20260817a" />
</head>
<body>
  <div class="ifx-shell" id="ifx-shell">
    <main class="ifx-shell__content">
      <div class="ifx-page">
        <div class="ifx-page__head">
          <h1 class="ifx-page__title">Danh sách người dùng</h1>
          <p class="ifx-page__meta">Người dùng cuối của iFlux.</p>
        </div>

        <section class="ifx-card">
          <div class="ifx-users-toolbar">
            <input
              class="ifx-input ifx-users-toolbar__search"
              id="users-search"
              type="search"
              autocomplete="off"
              placeholder="Tìm theo tên, email hoặc số điện thoại"
              aria-label="Tìm người dùng" />
            <select class="ifx-select" id="users-status" aria-label="Lọc theo trạng thái">
              <option value="">Mọi trạng thái</option>
              <option value="active">Hoạt động</option>
              <option value="suspended">Tạm khóa</option>
            </select>
            <div class="ifx-users-toolbar__end">
              <button class="ifx-button ifx-button--outline" id="users-export" type="button">Xuất CSV</button>
            </div>
          </div>

          <div class="ifx-table__scroll">
            <table class="ifx-table">
              <thead>
                <tr>
                  <th scope="col">Người dùng</th>
                  <th scope="col">Điện thoại</th>
                  <th scope="col">Trạng thái</th>
                  <th scope="col">Xác thực email</th>
                  <th scope="col">Ngày tạo</th>
                </tr>
              </thead>
              <tbody id="users-rows">
                <tr><td class="ifx-table__notice" colspan="5">Đang tải…</td></tr>
              </tbody>
            </table>
          </div>

          <div class="ifx-users-foot">
            <span id="users-count"></span>
            <div class="ifx-users-foot__pager">
              <button class="ifx-button ifx-button--outline" id="users-prev" type="button">Trước</button>
              <span id="users-page"></span>
              <button class="ifx-button ifx-button--outline" id="users-next" type="button">Sau</button>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="/admin/platform.js"></script>
  <script src="/admin/session.js"></script>
  <script src="/admin/api.js?v=20260815i"></script>
  <script src="/admin/auth-api.js"></script>
  <script src="/admin/navigation.js?v=20260817a"></script>
  <script src="/admin/shell.js?v=20260817c"></script>
  <script src="/admin/protect.js"></script>
  <script src="/admin/users/list.js?v=20260817a"></script>
</body>
</html>
