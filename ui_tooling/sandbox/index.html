<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>iFlux Design System</title>
  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);
      if (!p.get('area')) {
        if (p.get('module') === 'patterns' || p.get('pattern')) p.set('area', 'patterns');
        else p.set('area', 'design-system');
        p.delete('module');
      }
      var q = p.toString();
      window.location.replace('../workbench/' + (q ? '?' + q : '') + window.location.hash);
    })();
  </script>
</head>
<body>
  <p>Redirecting to Design System Workbench…</p>
</body>
</html>
